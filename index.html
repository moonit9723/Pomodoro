<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>포모도로 타이머</title>
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #080808;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
            margin: 0;
        }
        
        .container {
            display: flex;
            flex-direction: column;
            gap: 30px;
            max-width: 550px;
            width: 100%;
        }
        
        .card {
            background: #111111;
            padding: 40px 30px;
            border-radius: 20px;
            border: 1px solid #00ff66;
            box-shadow: 0 0 20px rgba(0, 255, 102, 0.15);
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        
        /* 네온 타이머 영역 */
        .timer-display {
            font-size: 6rem;
            font-weight: 800;
            color: #00ff66;
            text-shadow: 0 0 20px rgba(0, 255, 102, 0.6), 0 0 40px rgba(0, 255, 102, 0.2);
            margin: 10px 0 30px 0;
            font-variant-numeric: tabular-nums;
            letter-spacing: 2px;
        }
        
        .btn-group { display: flex; gap: 12px; width: 100%; }
        
        .btn {
            flex: 1;
            background-color: transparent;
            color: #00ff66;
            border: 2px solid #00ff66;
            padding: 16px;
            font-size: 1.1rem;
            font-weight: 700;
            border-radius: 10px;
            cursor: pointer;
            box-shadow: 0 0 10px rgba(0, 255, 102, 0.2);
            transition: all 0.2s ease;
        }
        .btn:hover {
            background-color: #00ff66;
            color: #000000;
            box-shadow: 0 0 20px rgba(0, 255, 102, 0.6);
        }
        .btn-reset {
            color: #666666;
            border-color: #333333;
            box-shadow: none;
        }
        .btn-reset:hover {
            background-color: #333333;
            color: #ffffff;
            box-shadow: none;
        }
        
        /* 네온 메모 영역 */
        .memo-section { align-items: stretch; padding: 30px; }
        
        .input-box { display: flex; gap: 10px; margin-bottom: 20px; }
        .input-box input {
            flex: 1;
            padding: 14px 16px;
            background-color: #080808;
            border: 1px solid #222222;
            color: #ffffff;
            border-radius: 8px;
            font-size: 1.05rem;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
        }
        .input-box input:focus {
            border-color: #00ff66;
            box-shadow: 0 0 10px rgba(0, 255, 102, 0.3);
        }
        .btn-add {
            flex: 0 0 80px;
            padding: 14px;
        }

        .memo-list {
            list-style: none;
            padding: 0;
            margin: 0;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .memo-item {
            background-color: #080808;
            border: 1px solid #222222;
            padding: 14px 16px;
            border-radius: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 1rem;
            color: #dddddd;
        }
        .btn-del {
            background: none;
            border: none;
            color: #444444;
            cursor: pointer;
            font-size: 1.1rem;
            padding: 0 4px;
            transition: color 0.2s;
        }
        .btn-del:hover { color: #ff3366; }
    </style>
</head>
<body>

    <div class="container">
        <!-- 타이머 -->
        <div class="card">
            <div class="timer-display" id="timer">25:00</div>
            <div class="btn-group">
                <button class="btn" onclick="startTimer()">시작</button>
                <button class="btn btn-reset" onclick="resetTimer()">초기화</button>
            </div>
        </div>

        <!-- 메모 -->
        <div class="card memo-section">
            <div class="input-box">
                <input type="text" id="wishInput" onkeypress="if(event.key==='Enter') addWish()">
                <button class="btn btn-add" onclick="addWish()">적기</button>
            </div>

            <ul class="memo-list" id="memoList"></ul>
        </div>
    </div>

    <script>
        /* 타이머 로직 */
        let timerInterval;
        let timeLeft = 25 * 60;

        function updateTimerDisplay() {
            const minutes = Math.floor(timeLeft / 60).toString().padStart(2, '0');
            const seconds = (timeLeft % 60).toString().padStart(2, '0');
            document.getElementById('timer').textContent = `${minutes}:${seconds}`;
        }

        function startTimer() {
            if (timerInterval) return;
            timerInterval = setInterval(() => {
                if (timeLeft > 0) {
                    timeLeft--;
                    updateTimerDisplay();
                } else {
                    clearInterval(timerInterval);
                    timerInterval = null;
                    alert("25분이 완료되었습니다.");
                }
            }, 1000);
        }

        function resetTimer() {
            clearInterval(timerInterval);
            timerInterval = null;
            timeLeft = 25 * 60;
            updateTimerDisplay();
        }

        /* 메모 로직 (입력한 텍스트 그대로 추가) */
        function addWish() {
            const input = document.getElementById('wishInput');
            let text = input.value.trim();
            if (!text) return;

            const ul = document.getElementById('memoList');
            const li = document.createElement('li');
            li.className = 'memo-item';
            li.innerHTML = `
                <span>${text}</span>
                <button class="btn-del" onclick="this.parentElement.remove()">✕</button>
            `;
            ul.prepend(li);
            input.value = '';
        }
    </script>
</body>
</html>
