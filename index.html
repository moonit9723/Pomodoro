<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>포모도로 타이머 & 수행평가 관리</title>
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #080c10;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px 10px;
            margin: 0;
        }
        
        .container {
            display: flex;
            flex-direction: column;
            gap: 12px;
            max-width: 400px;
            width: 100%;
        }
        
        .card {
            background: #0f171e;
            padding: 16px;
            border-radius: 14px;
            border: 1px solid #00f3ff;
            box-shadow: 0 0 12px rgba(0, 243, 255, 0.12);
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
        }
        
        /* 헤더 아이콘 영역 */
        .top-bar {
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 6px;
        }
        .icon-btn {
            background: none;
            border: none;
            color: #00f3ff;
            font-size: 1.2rem;
            cursor: pointer;
            padding: 4px;
            transition: transform 0.2s;
        }
        .icon-btn:hover { transform: scale(1.15); }
        .pomo-count-text { font-size: 0.82rem; color: #94a3b8; }
        .count-num { color: #00f3ff; font-weight: 700; }
        
        /* 과목 선택 드롭다운 */
        .subject-select {
            width: 100%;
            padding: 6px 10px;
            background-color: #080c10;
            border: 1px solid #00f3ff;
            color: #00f3ff;
            border-radius: 6px;
            font-size: 0.85rem;
            font-weight: 600;
            margin-bottom: 8px;
            outline: none;
        }

        /* 타이머 영역 */
        .timer-display {
            font-size: 3.5rem;
            font-weight: 800;
            color: #00f3ff;
            text-shadow: 0 0 15px rgba(0, 243, 255, 0.5);
            margin: 2px 0 10px 0;
            font-variant-numeric: tabular-nums;
            letter-spacing: 1px;
        }
        
        .btn-group { display: flex; gap: 8px; width: 100%; }
        .btn {
            flex: 1;
            background-color: transparent;
            color: #00f3ff;
            border: 1.5px solid #00f3ff;
            padding: 8px;
            font-size: 0.88rem;
            font-weight: 700;
            border-radius: 8px;
            cursor: pointer;
            box-shadow: 0 0 8px rgba(0, 243, 255, 0.15);
            transition: all 0.2s ease;
        }
        .btn:hover {
            background-color: #00f3ff;
            color: #080c10;
            box-shadow: 0 0 15px rgba(0, 243, 255, 0.5);
        }
        .btn-reset { color: #526270; border-color: #1e293b; box-shadow: none; }
        .btn-reset:hover { background-color: #1e293b; color: #ffffff; box-shadow: none; }
        
        .btn-thief {
            width: 100%;
            margin-top: 10px;
            background-color: #14222e;
            border: 1px dashed #00f3ff;
            color: #00f3ff;
            padding: 8px;
            border-radius: 8px;
            font-size: 0.85rem;
            font-weight: 700;
            cursor: pointer;
        }
        .btn-thief:hover { background-color: #1a2d3d; }

        /* 메모 영역 */
        .memo-section { align-items: stretch; padding: 14px; }
        .input-box { display: flex; gap: 8px; margin-bottom: 8px; }
        .input-box input {
            flex: 1;
            padding: 8px 10px;
            background-color: #080c10;
            border: 1px solid #1e293b;
            color: #ffffff;
            border-radius: 6px;
            font-size: 0.85rem;
            outline: none;
        }
        .input-box input:focus { border-color: #00f3ff; }
        .btn-add { flex: 0 0 55px; padding: 8px; }

        .memo-list {
            list-style: none;
            padding: 0;
            margin: 0;
            display: flex;
            flex-direction: column;
            gap: 6px;
            max-height: 110px;
            overflow-y: auto;
        }
        .memo-item {
            background-color: #080c10;
            border: 1px solid #1e293b;
            padding: 6px 10px;
            border-radius: 6px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.82rem;
            color: #e2e8f0;
        }
        .btn-del { background: none; border: none; color: #475569; cursor: pointer; font-size: 0.8rem; }
        .btn-del:hover { color: #ff3366; }

        /* 모달 */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.75);
            backdrop-filter: blur(3px);
            z-index: 100;
            justify-content: center;
            align-items: center;
        }
        .modal-content {
            background: #0f171e;
            border: 1px solid #00f3ff;
            box-shadow: 0 0 15px rgba(0, 243, 255, 0.2);
            border-radius: 14px;
            padding: 16px;
            width: 90%;
            max-width: 380px;
            max-height: 85vh;
            overflow-y: auto;
            position: relative;
        }
        .modal-close {
            position: absolute;
            top: 10px; right: 12px;
            background: none; border: none;
            color: #94a3b8; font-size: 1.1rem; cursor: pointer;
        }
        
        .calendar-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
        .calendar-title { font-size: 0.88rem; font-weight: 700; color: #00f3ff; }
        .calendar-nav { background: none; border: none; color: #94a3b8; cursor: pointer; }
        .calendar-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 3px; text-align: center; font-size: 0.7rem; }
        .day-name { color: #64748b; font-weight: 600; padding-bottom: 2px; }
        .day-cell {
            background-color: #080c10; border: 1px solid #1e293b; border-radius: 4px;
            padding: 3px 1px; min-height: 38px; display: flex; flex-direction: column;
            justify-content: space-between; align-items: center; cursor: pointer;
        }
        .day-cell.empty { border: none; background: none; cursor: default; }
        .day-cell.selected { border-color: #00f3ff; background-color: #1a2a3a; }
        .pomo-badge { font-size: 0.6rem; color: #00f3ff; font-weight: 700; }
        .detail-box { margin-top: 8px; padding-top: 8px; border-top: 1px solid #1e293b; font-size: 0.8rem; }
        .detail-title { color: #00f3ff; font-weight: 700; margin-bottom: 4px; }
        .detail-list { list-style: square; padding-left: 14px; margin: 0; color: #cbd5e1; }

        .thief-title { font-size: 0.95rem; font-weight: 700; color: #00f3ff; margin-bottom: 12px; text-align: center; }
        .rank-list { list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 8px; }
        .rank-item {
            display: flex; justify-content: space-between; align-items: center;
            background: #080c10; border: 1px solid #1e293b; padding: 8px 12px; border-radius: 6px; font-size: 0.85rem;
        }
        .rank-num { font-weight: 800; color: #00f3ff; width: 20px; }
        .rank-word { flex: 1; margin-left: 8px; }
        .rank-count { font-weight: 700; color: #94a3b8; }

        /* 수행평가 모달 스타일 */
        .eval-title { font-size: 0.95rem; font-weight: 700; color: #00f3ff; margin-bottom: 12px; text-align: center; }
        .eval-subject-card {
            background: #080c10;
            border: 1px solid #1e293b;
            border-radius: 8px;
            padding: 10px;
            margin-bottom: 10px;
        }
        .eval-subject-title {
            font-size: 0.88rem;
            font-weight: 700;
            color: #00f3ff;
            margin-bottom: 6px;
            border-bottom: 1px solid #1e293b;
            padding-bottom: 4px;
        }
        .eval-item-list {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }
        .eval-item {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 0.8rem;
            color: #cbd5e1;
        }
        .eval-item input[type="checkbox"] {
            accent-color: #00f3ff;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- 타이머 카드 -->
        <div class="card">
            <div class="top-bar">
                <button class="icon-btn" onclick="openModal('calendarModal')" title="달력 보기">📅</button>
                <div class="pomo-count-text">오늘 성공: <span class="count-num" id="todayPomo">0</span>회</div>
                <button class="icon-btn" onclick="openModal('evalModal')" title="수행평가 체크">📝</button>
            </div>
            
            <!-- 공부 과목 선택 -->
            <select id="pomoSubject" class="subject-select">
                <option value="독서와 작문">독서와 작문</option>
                <option value="영어II">영어II</option>
                <option value="미적분I">미적분I</option>
                <option value="확률과 통계">확률과 통계</option>
                <option value="생명과학">생명과학</option>
                <option value="기타">기타</option>
            </select>

            <div class="timer-display" id="timer">25:00</div>
            
            <div class="btn-group">
                <button class="btn" onclick="startTimer()">시작</button>
                <button class="btn btn-reset" onclick="resetTimer()">초기화</button>
            </div>

            <button class="btn-thief" onclick="showThiefRank()">내 집중력 도둑은? 🔍</button>
        </div>

        <!-- 메모 카드 -->
        <div class="card memo-section">
            <div class="input-box">
                <input type="text" id="wishInput" placeholder="딴생각 적기..." onkeypress="if(event.key==='Enter') addWish()">
                <button class="btn btn-add" onclick="addWish()">적기</button>
            </div>
            <ul class="memo-list" id="memoList"></ul>
        </div>
    </div>

    <!-- 1. 캘린더 모달 -->
    <div class="modal-overlay" id="calendarModal">
        <div class="modal-content">
            <button class="modal-close" onclick="closeModal('calendarModal')">✕</button>
            <div class="calendar-header">
                <button class="calendar-nav" onclick="changeMonth(-1)">❮</button>
                <div class="calendar-title" id="calendarMonth"></div>
                <button class="calendar-nav" onclick="changeMonth(1)">❯</button>
            </div>
            <div class="calendar-grid" id="calendarGrid"></div>
            
            <div class="detail-box" id="detailBox" style="display: none;">
                <div class="detail-title" id="detailDate"></div>
                <ul class="detail-list" id="detailList"></ul>
            </div>
        </div>
    </div>

    <!-- 2. 집중력 도둑 순위 모달 -->
    <div class="modal-overlay" id="thiefModal">
        <div class="modal-content">
            <button class="modal-close" onclick="closeModal('thiefModal')">✕</button>
            <div class="thief-title">내 집중력 도둑 순위 🏆</div>
            <ul class="rank-list" id="rankList"></ul>
        </div>
    </div>

    <!-- 3. 수행평가 관리 모달 -->
    <div class="modal-overlay" id="evalModal">
        <div class="modal-content">
            <button class="modal-close" onclick="closeModal('evalModal')">✕</button>
            <div class="eval-title">수행평가 & 시험 체크리스트 📝</div>
            <div id="evalContainer"></div>
        </div>
    </div>

    <script>
        /* 데이터 구조 (localStorage) */
        function getData() {
            return JSON.parse(localStorage.getItem('pomodoro_app_data') || '{}');
        }
        function saveData(data) {
            localStorage.setItem('pomodoro_app_data', JSON.stringify(data));
        }

        function getEvalData() {
            return JSON.parse(localStorage.getItem('pomodoro_eval_data') || '{}');
        }
        function saveEvalData(data) {
            localStorage.setItem('pomodoro_eval_data', JSON.stringify(data));
        }

        function getTodayKey() {
            const now = new Date();
            return `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}-${String(now.getDate()).padStart(2, '0')}`;
        }

        function initDayData(data, dateKey) {
            if (!data[dateKey]) {
                data[dateKey] = { pomo: 0, memos: [] };
            }
            return data;
        }

        /* 1. 모달 제어 */
        function openModal(id) { 
            document.getElementById(id).style.display = 'flex';
            if (id === 'evalModal') renderEvaluations();
        }
        function closeModal(id) { document.getElementById(id).style.display = 'none'; }

        /* 2. 타이머 기능 */
        let timerInterval;
        let timeLeft = 25 * 60;

        function updateTimerDisplay() {
            const m = Math.floor(timeLeft / 60).toString().padStart(2, '0');
            const s = (timeLeft % 60).toString().padStart(2, '0');
            document.getElementById('timer').textContent = `${m}:${s}`;
        }

        function startTimer() {
            if (timerInterval) return;
            timerInterval = setInterval(() => {
                if (timeLeft > 0) {
                    timeLeft--;
                    updateTimerDisplay();
                } else {
                    clearInterval(timerInterval);
                    timerInterval = null;
                    
                    const today = getTodayKey();
                    let data = getData();
                    data = initDayData(data, today);
                    data[today].pomo += 1;
                    saveData(data);

                    const selectedSubject = document.getElementById('pomoSubject').value;
                    updateViews();
                    alert(`[${selectedSubject}] 25분 뽀모도로 완료!`);
                }
            }, 1000);
        }

        function resetTimer() {
            clearInterval(timerInterval);
            timerInterval = null;
            timeLeft = 25 * 60;
            updateTimerDisplay();
        }

        /* 3. 메모 기능 */
        function addWish() {
            const input = document.getElementById('wishInput');
            let text = input.value.trim();
            if (!text) return;

            const today = getTodayKey();
            let data = getData();
            data = initDayData(data, today);
            data[today].memos.unshift(text);
            saveData(data);

            input.value = '';
            updateViews();
        }

        function deleteWish(index) {
            const today = getTodayKey();
            let data = getData();
            if (data[today] && data[today].memos) {
                data[today].memos.splice(index, 1);
                saveData(data);
                updateViews();
            }
        }

        function renderTodayMemos() {
            const today = getTodayKey();
            const data = getData();
            const todayData = data[today] || { pomo: 0, memos: [] };

            document.getElementById('todayPomo').textContent = todayData.pomo;

            const ul = document.getElementById('memoList');
            ul.innerHTML = '';
            todayData.memos.forEach((text, i) => {
                const li = document.createElement('li');
                li.className = 'memo-item';
                li.innerHTML = `
                    <span>${text}</span>
                    <button class="btn-del" onclick="deleteWish(${i})">✕</button>
                `;
                ul.appendChild(li);
            });
        }

        /* 4. 집중력 도둑 순위 */
        const TARGET_WORDS = ['야구', '노래', '유튜브', '게임'];

        function showThiefRank() {
            const data = getData();
            const counts = { '야구': 0, '노래': 0, '유튜브': 0, '게임': 0 };

            Object.values(data).forEach(day => {
                if (day.memos && Array.isArray(day.memos)) {
                    day.memos.forEach(memo => {
                        TARGET_WORDS.forEach(word => {
                            if (memo.includes(word)) {
                                counts[word]++;
                            }
                        });
                    });
                }
            });

            const sorted = Object.entries(counts).sort((a, b) => b[1] - a[1]);

            const rankList = document.getElementById('rankList');
            rankList.innerHTML = '';

            sorted.forEach(([word, count], idx) => {
                const li = document.createElement('li');
                li.className = 'rank-item';
                li.innerHTML = `
                    <span class="rank-num">${idx + 1}</span>
                    <span class="rank-word">${word}</span>
                    <span class="rank-count">${count}회</span>
                `;
                rankList.appendChild(li);
            });

            openModal('thiefModal');
        }

        /* 5. 캘린더 기능 */
        let currentDate = new Date();
        let selectedDateKey = getTodayKey();

        function changeMonth(delta) {
            currentDate.setMonth(currentDate.getMonth() + delta);
            renderCalendar();
        }

        function selectDate(dateStr) {
            selectedDateKey = dateStr;
            renderCalendar();
            renderDetail(dateStr);
        }

        function renderDetail(dateStr) {
            const data = getData();
            const dayData = data[dateStr] || { pomo: 0, memos: [] };
            const detailBox = document.getElementById('detailBox');
            const detailTitle = document.getElementById('detailDate');
            const detailList = document.getElementById('detailList');

            detailBox.style.display = 'block';
            detailTitle.textContent = `${dateStr} (뽀모도로 ${dayData.pomo}회)`;
            detailList.innerHTML = '';

            if (dayData.memos.length === 0) {
                detailList.innerHTML = '<li>메모가 없습니다.</li>';
            } else {
                dayData.memos.forEach(m => {
                    const li = document.createElement('li');
                    li.textContent = m;
                    detailList.appendChild(li);
                });
            }
        }

        function renderCalendar() {
            const year = currentDate.getFullYear();
            const month = currentDate.getMonth();

            document.getElementById('calendarMonth').textContent = `${year}년 ${month + 1}월`;

            const grid = document.getElementById('calendarGrid');
            grid.innerHTML = '';

            const dayNames = ['일', '월', '화', '수', '목', '금', '토'];
            dayNames.forEach(d => {
                const div = document.createElement('div');
                div.className = 'day-name';
                div.textContent = d;
                grid.appendChild(div);
            });

            const firstDay = new Date(year, month, 1).getDay();
            const lastDate = new Date(year, month + 1, 0).getDate();
            const data = getData();

            for (let i = 0; i < firstDay; i++) {
                const div = document.createElement('div');
                div.className = 'day-cell empty';
                grid.appendChild(div);
            }

            for (let d = 1; d <= lastDate; d++) {
                const dayStr = `${year}-${String(month + 1).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
                const dayData = data[dayStr] || { pomo: 0, memos: [] };

                const div = document.createElement('div');
                div.className = 'day-cell' + (dayStr === selectedDateKey ? ' selected' : '');
                div.onclick = () => selectDate(dayStr);
                
                let html = `<span>${d}</span>`;
                if (dayData.pomo > 0) {
                    html += `<span class="pomo-badge">🍅${dayData.pomo}</span>`;
                }
                div.innerHTML = html;
                grid.appendChild(div);
            }
        }

        /* 6. 수행평가 / 시험 관리 기능 */
        const EVAL_SUBJECTS = [
            { name: "독서와 작문", items: ["수행1", "수행2", "수행3", "중간고사", "기말고사"] },
            { name: "영어II", items: ["수행1", "수행2", "수행3", "중간고사", "기말고사"] },
            { name: "미적분I", items: ["수행1", "수행2", "수행3", "중간고사", "기말고사"] },
            { name: "확률과 통계", items: ["수행1", "수행2", "수행3", "중간고사", "기말고사"] },
            { name: "생명과학", items: ["수행1", "수행2", "수행3", "중간고사", "기말고사"] },
            { name: "역학과 에너지", items: ["수행1", "수행2", "수행3"] },
            { name: "음악", items: ["수행1", "수행2", "수행3"] },
            { name: "미술", items: ["수행1", "수행2", "수행3"] },
            { name: "체육", items: ["수행1", "수행2", "수행3"] },
            { name: "진로와직업", items: ["수행1", "수행2", "수행3"] }
        ];

        function toggleEvalCheck(subjectName, itemName) {
            const evalData = getEvalData();
            const key = `${subjectName}_${itemName}`;
            evalData[key] = !evalData[key];
            saveEvalData(evalData);
        }

        function renderEvaluations() {
            const container = document.getElementById('evalContainer');
            container.innerHTML = '';
            const evalData = getEvalData();

            EVAL_SUBJECTS.forEach(sub => {
                const card = document.createElement('div');
                card.className = 'eval-subject-card';

                const title = document.createElement('div');
                title.className = 'eval-subject-title';
                title.textContent = sub.name;
                card.appendChild(title);

                const itemList = document.createElement('div');
                itemList.className = 'eval-item-list';

                sub.items.forEach(item => {
                    const key = `${sub.name}_${item}`;
                    const isChecked = !!evalData[key];

                    const label = document.createElement('label');
                    label.className = 'eval-item';
                    label.innerHTML = `
                        <input type="checkbox" ${isChecked ? 'checked' : ''} onchange="toggleEvalCheck('${sub.name}', '${item}')">
                        <span>${item}</span>
                    `;
                    itemList.appendChild(label);
                });

                card.appendChild(itemList);
                container.appendChild(card);
            });
        }

        function updateViews() {
            renderTodayMemos();
            renderCalendar();
            if (document.getElementById('calendarModal').style.display === 'flex') {
                renderDetail(selectedDateKey);
            }
        }

        // 초기 실행
        updateViews();
    </script>
</body>
</html>
