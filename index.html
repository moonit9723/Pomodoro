<body>
<div id="app-timer" class="page active">

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script>
// 코드를 고칠 때마다 이 버전 문자열을 바꿔서 올리면, '상태 확인'에서 새 버전 반영 여부를 알 수 있어요
const APP_VERSION = '2026-10-21-b';

// ── 데이터 저장: Firebase Realtime Database (어느 기기에서 열어도 같은 데이터) ──
const SYNC_CONFIG = {
    apiKey: "AIzaSyDpvnO3YUB2KyHVuNQSt6JoBxH9GBQYNB4",
    authDomain: "pomodoro-app-763ce.firebaseapp.com",
    databaseURL: "https://pomodoro-app-763ce-default-rtdb.firebaseio.com",
    projectId: "pomodoro-app-763ce",
    storageBucket: "pomodoro-app-763ce.firebasestorage.app",
    messagingSenderId: "818555826060",
    appId: "1:818555826060:web:3a42770c6c440ccea830a9"
};
const SYNC_ID_KEY = 'pomodoro_sync_id';
let syncReady = false;
let baseRef = null;

function getSyncId() {
    let id = localStorage.getItem(SYNC_ID_KEY);
    if (!id) {
        id = prompt('기기 간 동기화용 코드를 정해주세요.\n(같은 코드를 모든 기기에 입력하면 데이터가 공유됩니다)') || '';
        if (id) localStorage.setItem(SYNC_ID_KEY, id);
    }
    return id;
}
async function initCloudSync() {
    try {
        if (!window.firebase) { setTimerStatus('⚠ Firebase 스크립트를 불러오지 못했어요.'); return; }
        if (!firebase.apps.length) firebase.initializeApp(SYNC_CONFIG);
        const id = getSyncId();
        if (!id) { setTimerStatus('동기화 코드가 설정되지 않았어요.'); return; }
        await firebase.auth().signInAnonymously();
        baseRef = firebase.database().ref('pomodoroUsers/' + encodeURIComponent(id));
        syncReady = true;
        // 다른 기기에서 바뀐 내용이 들어오면 실시간으로 화면 갱신
        baseRef.child('pomodoro_app_data').on('value', () => { updateViews(); });
        baseRef.child('pomodoro_tasks').on('value', (snap) => {
            tasksCache = snap.val() || {};
            renderTasks();
            renderUpcoming();
        });
        // 창을 새로 열 때(또는 다른 기기에서) 저장된 종료 시각을 즉시 반영
        baseRef.child('pomodoro_timer').on('value', (snap) => {
            applyRemoteTimerState(snap.val());
        });
    } catch (e) {
        console.warn('동기화 초기화 실패:', e);
        setTimerStatus('⚠ 동기화 연결에 실패했어요. (Firebase 설정/네트워크 확인)');
    }
}

// ── 날짜/시간 도우미 ──
const DAY_NAMES = ['일', '월', '화', '수', '목', '금', '토'];
function pad2(n) { return String(n).padStart(2, '0'); }
function dateKeyOf(d) { return `${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(d.getDate())}`; }
function getTodayKey() { return dateKeyOf(new Date()); }
function hhmm(d) { return `${pad2(d.getHours())}:${pad2(d.getMinutes())}`; }
function formatNoYear(dateStr) {
    if (!dateStr) return '';
    const parts = dateStr.split('-');
    if (parts.length === 3) return `${parseInt(parts[1])}월 ${parseInt(parts[2])}일`;
    return dateStr;
}

// ── 공부/메모 데이터 ──
// Firebase는 빈 배열을 저장하지 않아서(읽으면 사라짐) 읽을 때마다 형태를 보정합니다.
function toArray(v) {
    if (Array.isArray(v)) return v.filter(x => x != null);
    if (v && typeof v === 'object') return Object.keys(v).sort((a, b) => a - b).map(k => v[k]);
    return [];
}
function normalizeData(raw) {
    const data = (raw && typeof raw === 'object') ? raw : {};
    Object.keys(data).forEach(k => {
        const d = data[k];
        if (!d || typeof d !== 'object') { delete data[k]; return; }
        if (typeof d.pomo !== 'number') d.pomo = 0;
        d.memos = toArray(d.memos);
        d.sessions = toArray(d.sessions);
    });
    return data;
}
function initDayData(data, dateKey) {
    if (!data[dateKey]) data[dateKey] = {};
    const d = data[dateKey];
    if (typeof d.pomo !== 'number') d.pomo = 0;
    if (!Array.isArray(d.memos)) d.memos = [];
    if (!Array.isArray(d.sessions)) d.sessions = [];
    return data;
}
async function getData() {

}

// ── 타이머: '종료 시각(endAt)'을 db에 저장해두고 현재 시각과 비교해 남은 시간을 계산 ──
const BREAK_MIN = 5;
const DURATIONS = [10, 15, 20, 25, 30];
const savedMin = Number(localStorage.getItem('pomodoro_focus_min'));
let focusMin = DURATIONS.includes(savedMin) ? savedMin : 25;   // 내가 고른 집중 시간(분)
let timeLeft = focusMin * 60;
let timerEndAt = null;
let timerSubjectAtStart = null;
let timerDurationMin = focusMin;   // 지금 돌아가는(또는 방금 끝난) 타이머 길이(분)
let timerMode = 'focus';           // 'focus' 또는 'break'
let localTickInterval = null;
let completing = false;

function updateTimerDisplay() {
    const m = Math.floor(timeLeft / 60).toString().padStart(2, '0');
    const s = (timeLeft % 60).toString().padStart(2, '0');
    document.getElementById('timer').textContent = `${m}:${s}`;
}
function setTimerStatus(text) {
    document.getElementById('timerStatus').textContent = text;
}
function setDurationLock(locked) {
    document.getElementById('pomoDuration').disabled = locked;
}
function runningStatusText() {
    return timerMode === 'break' ? '휴식 중... 푹 쉬어요 ☕' : '집중 중... (창을 닫아도 시간은 계속 흘러요)';
}
function changeDuration() {
    if (timerEndAt != null) return;
    focusMin = Number(document.getElementById('pomoDuration').value);
    localStorage.setItem('pomodoro_focus_min', focusMin);
    timerDurationMin = focusMin;
    timeLeft = focusMin * 60;
    updateTimerDisplay();
}
// 이 기기의 타이머를 '대기 상태'로 되돌림
function resetLocalTimer() {
    stopLocalTick();
    timerEndAt = null;
    timerSubjectAtStart = null;
    timerMode = 'focus';
    timerDurationMin = focusMin;
    timeLeft = focusMin * 60;
    document.getElementById('pomoDuration').value = focusMin;
    setDurationLock(false);
    updateTimerDisplay();
    setTimerStatus('');
}
function startLocalTick() {
    if (localTickInterval) return;
    localTickInterval = setInterval(tick, 1000);
    tick();
}
function stopLocalTick() {
    clearInterval(localTickInterval);
    localTickInterval = null;
}
function tick() {
    if (timerEndAt == null) return;
    const remaining = Math.round((timerEndAt - Date.now()) / 1000);
    if (remaining > 0) {
        timeLeft = remaining;
        updateTimerDisplay();
    } else {
        timeLeft = 0;
        updateTimerDisplay();
        handleTimerComplete();
    }
}
// 여러 기기가 동시에 열려 있어도 완료 처리는 한 번만 하도록 '먼저 가져간 기기'만 처리
async function claimCompletion(endAtMs) {
    if (!syncReady) return true;
    try {
        const res = await baseRef.child('pomodoro_timer').transaction((cur) => {
            if (cur && cur.endAt === endAtMs) return null;
            return undefined;
        });
        return !!res.committed;
    } catch (e) {
        return true;
    }
}
async function handleTimerComplete() {
    if (completing) return;
    completing = true;
    stopLocalTick();
    const endAtMs = timerEndAt || Date.now();
    const mode = timerMode;
    const minutes = timerDurationMin;
    const subject = timerSubjectAtStart || document.getElementById('pomoSubject').value;
    const claimed = await claimCompletion(timerEndAt);
    resetLocalTimer();
    if (!claimed) { completing = false; return; }

    if (mode === 'break') {          // 휴식은 기록하지 않음
        completing = false;
        alert('휴식 끝! 다시 집중해 볼까요? 💪');
        return;
    }
    const endD = new Date(endAtMs);
    const startD = new Date(endAtMs - minutes * 60 * 1000);
    const key = dateKeyOf(endD);
    let data = await getData();
    data = initDayData(data, key);
    data[key].pomo += 1;
    data[key].sessions.push({ start: hhmm(startD), end: hhmm(endD), subject, min: minutes });
    await saveData(data);
    await updateViews();
    setTimerStatus(`${focusMin}분 세팅 완료 - 시작 버튼을 누르면 다시 시작돼요`);
    completing = false;
    if (confirm(`[${subject}] ${minutes}분 뽀모도로 완료! 🍅\n${BREAK_MIN}분 휴식 할까요?`)) startTimer('break');
}
async function startTimer(mode) {
    if (timerEndAt != null) return;
    mode = (mode === 'break') ? 'break' : 'focus';   // 시작 버튼 클릭 시 인자가 이벤트가 아니라 비어 있음
    const subject = document.getElementById('pomoSubject').value;
    timerMode = mode;
    timerDurationMin = (mode === 'break') ? BREAK_MIN : focusMin;
    timerSubjectAtStart = subject;
    timeLeft = timerDurationMin * 60;
    timerEndAt = Date.now() + timeLeft * 1000;
    setDurationLock(true);
    setTimerStatus(runningStatusText());
    startLocalTick();
    if (syncReady) {
        try { await baseRef.child('pomodoro_timer').set({ endAt: timerEndAt, subject, duration: timerDurationMin, mode }); } catch (e) { console.error('타이머 저장 실패:', e); }
    }
}
async function resetTimer() {
    resetLocalTimer();
    if (syncReady) {
        try { await baseRef.child('pomodoro_timer').remove(); } catch (e) {}
    }
}
function applyRemoteTimerState(remote) {
    if (completing) return;
    const remoteEndAt = (remote && remote.endAt) ? remote.endAt : null;
    if (remoteEndAt === timerEndAt) return;
    if (remoteEndAt == null) { resetLocalTimer(); return; }
    timerEndAt = remoteEndAt;
    timerSubjectAtStart = remote.subject || null;
    timerMode = (remote.mode === 'break') ? 'break' : 'focus';
    timerDurationMin = remote.duration || 25;     // 예전 기록(길이 없음)은 25분
    if (timerMode === 'focus') {
        if (timerSubjectAtStart) document.getElementById('pomoSubject').value = timerSubjectAtStart;
        document.getElementById('pomoDuration').value = timerDurationMin;
    }
    setDurationLock(true);
    const remaining = Math.round((timerEndAt - Date.now()) / 1000);
    if (remaining > 0) {
        timeLeft = remaining;
        updateTimerDisplay();
        setTimerStatus(runningStatusText());
        startLocalTick();
    } else {
        timeLeft = 0;
        updateTimerDisplay();
        handleTimerComplete();
    }
}

// ── 공부 시간 계산 ──
// 세션 하나의 길이(분): 저장된 min 값이 있으면 사용, 없으면 시작~끝 시각으로 계산, 그래도 안 되면 25분
function sessionMinutes(s) {
    if (typeof s.min === 'number' && s.min > 0) return s.min;
    const a = String(s.start).split(':').map(Number);
    const b = String(s.end).split(':').map(Number);
    if (a.length === 2 && b.length === 2 && !a.concat(b).some(isNaN)) {
        let diff = (b[0] * 60 + b[1]) - (a[0] * 60 + a[1]);
        if (diff <= 0) diff += 24 * 60;
        return diff;
    }
    return 25;
}
// 하루 공부 시간(분): 시간 기록이 있는 세션 + 시간 기록 이전 횟수(25분으로 계산)
function dayStudyMin(day) {
    const sessions = day.sessions || [];
    const legacy = Math.max(0, (day.pomo || 0) - sessions.length);
    return sessions.reduce((sum, s) => sum + sessionMinutes(s), 0) + legacy * 25;
}
function fmtMin(m) {
    const h = Math.floor(m / 60), r = m % 60;
    if (h === 0) return `${r}분`;
    return r ? `${h}시간 ${r}분` : `${h}시간`;
}
function fmtMinShort(m) {
    const h = Math.floor(m / 60), r = m % 60;
    if (h === 0) return `${r}m`;
    return r ? `${h}h${r}m` : `${h}h`;
}

// ── 공부 기록 취소 (idx가 -1이면 '시간 기록 없음' 항목) ──
async function cancelSession(dateStr, idx) {
    if (!confirm('이 공부 기록을 취소할까요?\n뽀모도로 횟수도 1회 줄어요.')) return;
    const data = await getData();
    const d = data[dateStr];
    if (!d) return;
    if (idx >= 0) {
        if (idx >= d.sessions.length) return;
        d.sessions.splice(idx, 1);
    } else if (d.pomo <= d.sessions.length) {
        return;
    }
    d.pomo = Math.max(0, d.pomo - 1);
    await saveData(data);
    await updateViews();
}
function makeCancelBtn(onClick) {
    const btn = document.createElement('button');
    btn.className = 'btn-del session-del';
    btn.textContent = '✕';
    btn.title = '기록 취소';
    btn.onclick = onClick;
    return btn;
}

// ── 할 일 기록 (며칠 몇 교시까지 무엇을 할지) ──
let tasksCache = {};
function addTask() {
    const dateEl = document.getElementById('taskDate');
    const periodEl = document.getElementById('taskPeriod');
    const textEl = document.getElementById('taskText');
    const date = dateEl.value;
    const text = textEl.value.trim();
    if (!date) { alert('날짜를 선택해 주세요.'); return; }
    if (!text) return;
    if (!syncReady) { alert('저장소에 연결되지 않아 저장할 수 없어요.'); return; }
    const id = Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
    baseRef.child('pomodoro_tasks/' + id).set({ date, period: Number(periodEl.value), text, done: false })
        .catch(e => console.error('저장 실패:', e));
    textEl.value = '';
}
function toggleTask(id, done) {
    if (!syncReady) return;
    baseRef.child('pomodoro_tasks/' + id + '/done').set(done).catch(e => console.error(e));
}
function deleteTask(id) {
    if (!syncReady) return;
    baseRef.child('pomodoro_tasks/' + id).remove().catch(e => console.error(e));
}
function renderTasks() {
    const ul = document.getElementById('taskList');
    const items = Object.keys(tasksCache)
        .map(id => Object.assign({ id }, tasksCache[id]))
        .filter(t => t && t.date && t.text);
    items.sort((a, b) =>
        (a.done ? 1 : 0) - (b.done ? 1 : 0) ||
        String(a.date).localeCompare(String(b.date)) ||
        (a.period || 0) - (b.period || 0));
    ul.innerHTML = '';
    if (items.length === 0) {
        const li = document.createElement('li');
        li.className = 'task-empty';
        li.textContent = '아직 적은 할 일이 없어요.';
        ul.appendChild(li);
        return;
    }
    items.forEach(t => {
        const [y, mo, d] = String(t.date).split('-').map(Number);
        const target = new Date(y, mo - 1, d);
        const { diff, label: dday } = getDday(t.date);
        const li = document.createElement('li');
        li.className = 'task-item' + (t.done ? ' done' : '') + (!t.done && diff < 0 ? ' overdue' : '');
        const cb = document.createElement('input');
        cb.type = 'checkbox';
        cb.className = 'task-check';
        cb.checked = !!t.done;
        cb.onchange = () => toggleTask(t.id, cb.checked);
        const body = document.createElement('div');
        body.className = 'task-body';
        const when = document.createElement('div');
        when.className = 'task-when';
        when.textContent = `${mo}월 ${d}일(${DAY_NAMES[target.getDay()]}) ${t.period}교시까지 · ${dday}`;
        const text = document.createElement('div');
        text.className = 'task-text';
        text.textContent = t.text;
        body.appendChild(when);
        body.appendChild(text);
        const del = document.createElement('button');
        del.className = 'btn-del';
        del.textContent = '✕';
        del.title = '삭제';
        del.onclick = () => deleteTask(t.id);
        li.appendChild(cb);
        li.appendChild(body);
        li.appendChild(del);
        ul.appendChild(li);
    });
}

// ── 마감까지 남은 날 계산 (할 일 화면/타이머 화면 공통) ──
function getDday(dateStr) {
    const [y, mo, d] = String(dateStr).split('-').map(Number);
    const now = new Date();
    const todayMid = new Date(now.getFullYear(), now.getMonth(), now.getDate());
    const diff = Math.round((new Date(y, mo - 1, d) - todayMid) / 86400000);
    const label = diff === 0 ? '오늘' : (diff > 0 ? `D-${diff}` : `${-diff}일 지남`);
    return { diff, label };
}

// ── 타이머 화면: 임박한 할 일 (안 끝낸 것 중 가장 급한 3개) ──

}

let deferredInstall = null;
function isStandalone() {

}
function isIOSDevice() {
    return /iphone|ipad|ipod/i.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
}
function updateInstallBox() {
    const btn = document.getElementById('installBtn');
    btn.style.display = (!isStandalone() && (deferredInstall || isIOSDevice())) ? 'block' : 'none';
}
async function installApp() {
    if (deferredInstall) {
        deferredInstall.prompt();
        try { await deferredInstall.userChoice; } catch (e) {}
        deferredInstall = null;
        updateInstallBox();
        return;
    }
    if (isIOSDevice()) {
        alert('아이폰/아이패드에서 설치하는 방법\n\n1) Safari로 이 페이지를 엽니다\n2) 화면 아래(또는 위)의 공유 버튼(□↑)을 누릅니다\n3) "홈 화면에 추가"를 누릅니다');
    }
}
window.addEventListener('beforeinstallprompt', (e) => {
    e.preventDefault();
    deferredInstall = e;
    updateInstallBox();
});
window.addEventListener('appinstalled', () => { deferredInstall = null; updateInstallBox(); });
if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
    window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js').catch(e => console.warn('서비스 워커 등록 실패:', e));
    });
}

// 저장돼 있던 앱 파일(캐시)을 지우고 최신 파일로 다시 열기 (기록 데이터는 지워지지 않음)
async function hardRefresh() {
    try {
        if ('serviceWorker' in navigator) {
            const regs = await navigator.serviceWorker.getRegistrations();
            await Promise.all(regs.map(r => r.unregister()));
        }
        if (window.caches) {
            const keys = await caches.keys();
            await Promise.all(keys.map(k => caches.delete(k)));
        }
    } catch (e) {}
    location.replace(location.pathname + '?v=' + Date.now());
}

// ── 상태 확인 (앱 버전 · 저장 · 기록 · 타이머) ──
function withTimeout(promise, ms) {
    return Promise.race([
        promise,
        new Promise((_, reject) => setTimeout(() => reject(new Error('서버 응답 없음 (인터넷 연결 확인)')), ms))
    ]);
}
async function runCheck() {
    const list = document.getElementById('checkList');
    list.innerHTML = '';
    openModal('checkModal');
    const add = (ok, label, detail) => {
        const li = document.createElement('li');
        li.className = 'check-item' + (ok ? '' : ' bad');
        const head = document.createElement('div');
        head.className = 'check-label';
        head.textContent = (ok ? '✅ ' : '❌ ') + label;
        li.appendChild(head);
        if (detail) {
            const d = document.createElement('div');
            d.className = 'check-detail';
            d.textContent = detail;
            li.appendChild(d);
        }
        list.appendChild(li);
        return li;
    };

    // 0) 앱 버전: 서버(깃허브)에 올라간 최신 파일과 지금 화면의 버전 비교
    try {
        const res = await withTimeout(fetch('index.html?v=' + Date.now(), { cache: 'no-store' }), 8000);
        if (!res.ok) throw new Error('HTTP ' + res.status);
        const text = await res.text();
        const m = text.match(/APP_VERSION\s*=\s*'([^']+)'/);
        const latest = m ? m[1] : null;
        if (latest === APP_VERSION) {
            add(true, '앱 버전: ' + APP_VERSION, '최신 버전이에요.');
        } else {
            const li = add(false, '앱 버전: ' + APP_VERSION,
                latest ? `새 버전(${latest})이 올라와 있어요. 아래 버튼으로 최신으로 바꿔 주세요.`
                       : '서버의 파일에 버전 표시가 없어요. 업로드가 덜 됐거나 반영 중일 수 있어요.');
            if (latest) {
                const btn = document.createElement('button');
                btn.className = 'btn-recheck';
                btn.style.marginTop = '6px';
                btn.textContent = '최신 버전으로 바꾸기';
                btn.onclick = hardRefresh;
                li.appendChild(btn);
            }
        }
    } catch (e) {
        add(false, '앱 버전: ' + APP_VERSION, '서버의 최신 파일을 확인하지 못했어요: ' + ((e && e.message) || e));
    }

    // 1) 저장소 연결
    if (!syncReady) {
        add(false, '저장소 연결', '연결되지 않았어요. ' + (document.getElementById('timerStatus').textContent || '페이지를 새로고침하고 동기화 코드를 확인하세요.'));
        return;
    }
    add(true, '저장소 연결', '동기화 코드: ' + (localStorage.getItem(SYNC_ID_KEY) || '-'));

    // 2) 실제로 쓰고 다시 읽어 보기 (기록용 데이터에는 영향 없음)
    try {
        const stamp = Date.now();
        const ref = baseRef.child('pomodoro_check');
        await withTimeout(ref.set({ t: stamp }), 8000);
        const snap = await withTimeout(ref.once('value'), 8000);
        const back = snap.val();
        await withTimeout(ref.remove(), 8000);
        if (back && back.t === stamp) add(true, '저장·불러오기 테스트', '정상적으로 저장되고 다시 읽혀요.');
        else add(false, '저장·불러오기 테스트', '저장은 했는데 읽은 값이 달라요.');
    } catch (e) {
        add(false, '저장·불러오기 테스트', '실패: ' + ((e && (e.code || e.message)) || e) + ' (Firebase 규칙/권한을 확인하세요)');
        return;
    }

    // 3) 완료한 뽀모도로 기록
    const data = await getData();
    const todayData = data[getTodayKey()] || { pomo: 0, sessions: [] };
    const byStart = (a, b) => String(a.start).localeCompare(String(b.start));
    const todaySessions = todayData.sessions.slice().sort(byStart);
    if (todaySessions.length > 0) {
        const last = todaySessions[todaySessions.length - 1];
        add(true, `오늘 완료한 뽀모도로: ${todayData.pomo}회`, `마지막 기록: ${last.start} ~ ${last.end} · ${last.subject || '과목 미지정'}`);
    } else {
        const keys = Object.keys(data).filter(k => data[k].sessions.length > 0).sort();
        if (keys.length > 0) {
            const k = keys[keys.length - 1];
            const last = data[k].sessions.slice().sort(byStart).pop();
            add(true, `오늘 완료한 뽀모도로: ${todayData.pomo}회`, `오늘은 아직 없어요. 가장 최근 기록: ${formatNoYear(k)} ${last.start} ~ ${last.end} · ${last.subject || '과목 미지정'}`);
        } else {
            add(true, `오늘 완료한 뽀모도로: ${todayData.pomo}회`, '시간이 남은 기록은 아직 없어요. 타이머를 한 번 완료하면 여기에 나타나요.');
        }
    }

    // 4) 타이머 상태
    if (timerEndAt != null) add(true, '타이머', `${timerMode === 'break' ? '휴식' : '집중'} 진행 중 · 약 ${Math.ceil(timeLeft / 60)}분 남음 (끝나면 자동으로 처리돼요)`);
    else add(true, '타이머', '대기 중 (시작 버튼을 눌러야 기록 대상이 돼요)');
}

async function updateViews() {
    await renderTodayMemos();
    await renderCalendar();
    if (document.getElementById('calendarModal').style.display === 'flex') {
        await renderDetail(selectedDateKey);
    }
}

// 초기 로드
document.getElementById('taskDate').value = getTodayKey();
document.getElementById('pomoDuration').value = focusMin;
updateTimerDisplay();
(async () => {
    await initCloudSync();
    await updateViews();
})();

// 화면으로 돌아왔을 때 한 번 더 최신 상태 확인 (보조용)
document.addEventListener('visibilitychange', async () => {
    if (!document.hidden) { await updateViews(); renderUpcoming(); }
});
// 자정이 지나면 D-day가 바뀌므로 1분마다 다시 계산
setInterval(renderUpcoming, 60 * 1000);
updateInstallBox();
</script>
