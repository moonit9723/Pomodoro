<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>포모도로 타이머</title>
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #121212;
            color: #e0e0e0;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 40px 20px;
            margin: 0;
        }
        
        .container {
            display: flex;
            flex-direction: column;
            gap: 20px;
            max-width: 400px;
            width: 100%;
        }
        
        .card {
            background: #1e1e1e;
            padding: 28px;
            border-radius: 12px;
            border: 1px solid #2d2d2d;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        
        /* 타이머 영역 */
        .timer-display {
            font-size: 3.8rem;
            font-weight: 700;
            color: #ffffff;
            margin: 10px 0 20px 0;
            font-variant-numeric: tabular-nums;
        }
        
        .btn-group { display: flex; gap: 8px; width: 100%; }
        
        .btn {
            flex: 1;
            background-color: #373737;
            color: #ffffff;
            border: none;
            padding: 12px;
            font-size: 0.95rem;
            font-weight: 600;
            border-radius: 6px;
            cursor: pointer;
            transition: background-color 0.2s;
        }
        .btn:hover { background-color: #4a4a4a; }
        .btn-reset { background-color: #2a2a2a; color: #888888; }
        .btn-reset:hover { background-color: #333333; color: #aaaaaa; }
        
        /* 메모 영역 */
        .memo-section { align-items: stretch; }
        
        .input-box { display: flex; gap: 8px; margin-bottom: 16px; }
        .input-box input {
            flex: 1;
            padding: 10px 12px;
            background-color: #121212;
            border: 1px solid #333333;
            color: #ffffff;
            border-radius: 6px;
            font-size: 0.95rem;
            outline: none;
        }
        .input-box input:focus { border-color: #555555; }
        .btn-add { flex: 0 0 60px; background-color: #373737; }

        .memo-list {
            list-style: none;
            padding: 0;
            margin: 0;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .memo-item {
            background-color: #121212;
            border: 1px solid #2d2d2d;
            padding: 10px 12px;
            border-radius: 6px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.95rem;
            color: #cccccc;
        }
        .btn-del {
            background: none;
            border: none;
            color: #555555;
            cursor: pointer;
            font-size: 0.9rem;
            padding: 0 4px;
        }
        .btn-del:hover { color: #ffffff; }
    </style>
</head>
<body>

    <div class="container">
        <!-- 타이머 -->
        <div class="card">
            <div class="timer-display" id="timer">25:00</div>
            <div class="btn-group">
                <button class="btn" onclick="startTimer()">시작</button>
                <button class="btn btn-reset" onclick="resetTimer()">초기화</button>
            </div>
        </div>

        <!-- 메모 -->
        <div class="card memo-section">
            <div class="input-box">
                <input type="text" id="wishInput" onkeypress="if(event.key==='Enter') addWish()">
                <button class="btn btn-add" onclick="addWish()">적기</button>
            </div>

            <ul class="memo-list" id="memoList"></ul>
        </div>
    </div>

    <script>
        /* 타이머 로직 */
        let timerInterval;
        let timeLeft = 25 * 60;

        function updateTimerDisplay() {
            const minutes = Math.floor(timeLeft / 60).toString().padStart(2, '0');
            const seconds = (timeLeft % 60).toString().padStart(2, '0');
            document.getElementById('timer').textContent = `${minutes}:${seconds}`;
        }

        function startTimer() {
            if (timerInterval) return;
            timerInterval = setInterval(() => {
                if (timeLeft > 0) {
                    timeLeft--;
                    updateTimerDisplay();
                } else {
                    clearInterval(timerInterval);
                    timerInterval = null;
                    alert("25분이 완료되었습니다.");
                }
            }, 1000);
        }

        function resetTimer() {
            clearInterval(timerInterval);
            timerInterval = null;
            timeLeft = 25 * 60;
            updateTimerDisplay();
        }

        /* 메모 로직 */
        function addWish() {
            const input = document.getElementById('wishInput');
            let text = input.value.trim();
            if (!text) return;

            if (!text.endsWith('하고 싶다') && !text.endsWith('하고싶다')) {
                text += ' 하고 싶다';
            }

            const ul = document.getElementById('memoList');
            const li = document.createElement('li');
            li.className = 'memo-item';
            li.innerHTML = `
                <span>${text}</span>
                <button class="btn-del" onclick="this.parentElement.remove()">✕</button>
            `;
            ul.prepend(li);
            input.value = '';
        }
    </script>
</body>
</html>
