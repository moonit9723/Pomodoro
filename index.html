<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>포모도로 타이머 & 할 일 기록</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#080c10">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="포모도로">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
* { box-sizing: border-box; }
body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background-color: #080c10; color: #fff; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; padding: calc(20px + env(safe-area-inset-top)) calc(10px + env(safe-area-inset-right)) calc(20px + env(safe-area-inset-bottom)) calc(10px + env(safe-area-inset-left)); margin: 0; }
.container { display: flex; flex-direction: column; gap: 12px; max-width: 400px; width: 100%; }
.page { display: none; width: 100%; max-width: 420px; flex-direction: column; align-items: center; }
.page.active { display: flex; }
.card { background: #0f171e; padding: 16px; border-radius: 14px; border: 1px solid #00f3ff; box-shadow: 0 0 12px rgba(0,243,255,0.12); display: flex; flex-direction: column; align-items: center; position: relative; width: 100%; }
.top-bar { width: 100%; display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
.icon-btn { background: none; border: none; color: #00f3ff; font-size: 1.2rem; cursor: pointer; padding: 4px; transition: transform 0.2s; }
.icon-btn:hover { transform: scale(1.15); }
.pomo-count-text { font-size: 0.82rem; color: #94a3b8; }
.count-num { color: #00f3ff; font-weight: 700; }
.subject-select { width: 100%; padding: 6px 10px; background-color: #080c10; border: 1px solid #00f3ff; color: #00f3ff; border-radius: 6px; font-size: 0.85rem; font-weight: 600; margin-bottom: 8px; outline: none; }
.subject-select:disabled { opacity: 0.5; }
.timer-display { font-size: 3.5rem; font-weight: 800; color: #00f3ff; text-shadow: 0 0 15px rgba(0,243,255,0.5); margin: 2px 0 10px 0; font-variant-numeric: tabular-nums; letter-spacing: 1px; }
.timer-status { font-size: 0.78rem; color: #64748b; margin-top: -6px; margin-bottom: 8px; min-height: 14px; }
.btn-start { width: 100%; background-color: transparent; color: #00f3ff; border: 1.5px solid #00f3ff; padding: 12px; font-size: 1rem; font-weight: 700; border-radius: 8px; cursor: pointer; box-shadow: 0 0 8px rgba(0,243,255,0.15); transition: all 0.2s ease; }
.btn-start:hover { background-color: #00f3ff; color: #080c10; box-shadow: 0 0 15px rgba(0,243,255,0.5); }
.btn-reset-small { width: 100%; margin-top: 8px; background-color: transparent; color: #ff4d4d; border: 1px solid #3a1e28; padding: 5px; font-size: 0.72rem; font-weight: 600; border-radius: 6px; cursor: pointer; transition: all 0.2s ease; }
.btn-reset-small:hover { background-color: #ff4d4d; color: #fff; border-color: #ff4d4d; }
.btn-thief { width: 100%; margin-top: 10px; background-color: #14222e; border: 1px dashed #00f3ff; color: #00f3ff; padding: 8px; border-radius: 8px; font-size: 0.85rem; font-weight: 700; cursor: pointer; }
.btn-thief:hover { background-color: #1a2d3d; }
.memo-section { align-items: stretch; padding: 14px; margin-top: 12px; }
.input-box { display: flex; gap: 8px; margin-bottom: 8px; }
.input-box input { flex: 1; padding: 8px 10px; background-color: #080c10; border: 1px solid #1e293b; color: #fff; border-radius: 6px; font-size: 0.85rem; outline: none; }
.input-box input:focus { border-color: #00f3ff; }
.btn-add { flex: 0 0 55px; padding: 8px; background: none; border: 1px solid #00f3ff; color: #00f3ff; border-radius: 6px; cursor: pointer; font-weight: bold; }
.memo-list { list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 6px; max-height: 110px; overflow-y: auto; }
.memo-item { background-color: #080c10; border: 1px solid #1e293b; padding: 6px 10px; border-radius: 6px; display: flex; justify-content: space-between; align-items: center; font-size: 0.82rem; color: #e2e8f0; }
.btn-del { background: none; border: none; color: #ff4d4d; cursor: pointer; font-size: 0.8rem; }
.btn-del:hover { color: #ff9a9a; }
.session-del { margin-left: 8px; padding: 2px 8px; color: #ff6b6b; border: 1px solid #5b2a35; border-radius: 4px; font-size: 0.85rem; }
.session-del:hover { background: #ff4d4d; color: #fff; }
.modal-content.modal-wide { max-width: 560px; width: 94%; max-height: 90vh; }
.detail-total { color: #94a3b8; font-size: 0.78rem; font-weight: 600; margin-bottom: 4px; }
.trash-list { list-style: none; padding: 0; margin: 0 0 10px; display: flex; flex-direction: column; gap: 6px; }
.trash-item { background: #080c10; border: 1px solid #1e293b; border-radius: 8px; padding: 8px 10px; font-size: 0.8rem; color: #e2e8f0; }
.trash-meta { color: #64748b; font-size: 0.7rem; margin-top: 2px; }
.trash-actions { display: flex; gap: 6px; margin-top: 6px; }
.trash-actions button { flex: 1; padding: 5px; border-radius: 6px; font-size: 0.75rem; font-weight: 700; cursor: pointer; background: transparent; }
.trash-restore { color: #00f3ff; border: 1px solid #00f3ff; }
.trash-restore:hover { background: #00f3ff; color: #080c10; }
.trash-purge { color: #ff6b6b; border: 1px solid #5b2a35; }
.trash-purge:hover { background: #ff4d4d; color: #fff; }
.subject-filter { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 8px; }
.subject-chip { display: flex; align-items: center; gap: 4px; background: #080c10; border: 1px solid #00f3ff; color: #00f3ff; border-radius: 14px; padding: 4px 9px; font-size: 0.75rem; font-weight: 700; cursor: pointer; user-select: none; }
.subject-chip.off { border-color: #1e293b; color: #64748b; }
.subject-chip input { accent-color: #00f3ff; margin: 0; cursor: pointer; }
.month-summary { font-size: 0.8rem; color: #cbd5e1; font-weight: 700; margin-bottom: 10px; white-space: pre-line; }
.confirm-box { text-align: center; max-width: 340px; padding: 26px 18px 18px; }
.confirm-title { font-size: 1.6rem; font-weight: 800; color: #fff; line-height: 1.35; word-break: keep-all; margin-bottom: 12px; }
.confirm-detail { font-size: 0.8rem; color: #94a3b8; white-space: pre-line; margin-bottom: 18px; }
.confirm-actions { display: flex; gap: 8px; }
.confirm-actions button { flex: 1; padding: 11px; border-radius: 8px; font-size: 0.95rem; font-weight: 700; cursor: pointer; background: transparent; }
.confirm-no { color: #00f3ff; border: 1.5px solid #00f3ff; }
.confirm-no:hover { background: #00f3ff; color: #080c10; }
.confirm-yes { color: #ff6b6b; border: 1.5px solid #ff6b6b; }
.confirm-yes:hover { background: #ff4d4d; color: #fff; }
.date-btn { text-align: left; cursor: pointer; font-family: inherit; }
.task-hint { width: 100%; font-size: 0.72rem; color: #64748b; margin: -4px 0 8px; }
.task-edit { display: flex; flex-direction: column; gap: 6px; width: 100%; margin-bottom: 4px; }
.btn-cancel-edit { color: #94a3b8; border-color: #1e293b; }
.datepick-box { max-width: 440px; width: 94%; }
.datepick-box .calendar-title { font-size: 1.1rem; }
.datepick-grid { gap: 5px; font-size: 1rem; }
.datepick-grid .day-name { font-size: 0.85rem; padding-bottom: 4px; }
.datepick-grid .day-cell { min-height: 54px; justify-content: center; align-items: center; font-size: 1.05rem; font-weight: 700; color: #e2e8f0; }
.datepick-grid .day-cell:hover { border-color: #00f3ff; }
.datepick-grid .day-cell.today { border-color: #ffb347; color: #ffb347; }
.datepick-grid .day-cell.selected { color: #00f3ff; }
.app-grid { width: 100%; display: flex; justify-content: center; }
.top-actions { display: flex; align-items: center; gap: 2px; }
.btn-row { display: flex; flex-wrap: wrap; gap: 8px; width: 100%; }
.btn-row .btn-thief { flex: 1 1 45%; }
.trash-note { font-size: 0.72rem; color: #64748b; text-align: center; margin: -6px 0 12px; }
.trash-cols { display: grid; grid-template-columns: 1fr; gap: 14px; margin-bottom: 10px; }
.trash-col-title { font-size: 0.85rem; font-weight: 800; color: #00f3ff; margin-bottom: 6px; }
.confirm-gray { color: #94a3b8; border: 1.5px solid #1e293b; }
.session-fields { display: flex; flex-direction: column; gap: 10px; margin: 10px 0 18px; text-align: left; }
.session-fields label { display: flex; justify-content: space-between; align-items: center; gap: 10px; font-size: 0.85rem; color: #94a3b8; }
.session-fields .task-input, .session-fields .task-select { flex: 0 0 55%; width: 55%; }
.session-edit { color: #00f3ff; border-color: #1e4a55; margin-left: 6px; }
.session-edit:hover { background: #00f3ff; color: #080c10; }
.add-session-btn { width: 100%; margin: 4px 0 6px; background: transparent; color: #00f3ff; border: 1px dashed #00f3ff; padding: 6px; border-radius: 6px; font-size: 0.8rem; font-weight: 700; cursor: pointer; }
.add-session-btn:hover { background: #00f3ff; color: #080c10; }
@media (min-width: 900px) {
    body { justify-content: flex-start; padding: 16px; }
    .app-grid { display: grid; grid-template-columns: 1fr 2fr 1fr; grid-template-areas: "tasks timer memo"; gap: 16px; height: calc(100vh - 32px); max-width: 1600px; margin: 0 auto; }
    .page, .page.active, .container { display: contents !important; }
    .only-mobile, .upcoming-card { display: none !important; }
    .app-grid .card { min-height: 0; overflow-y: auto; }
    .container > .card { grid-area: timer; justify-content: center; }
    .container > .memo-section { grid-area: memo; margin-top: 0; justify-content: flex-start; }
    #app-tasks > .card { grid-area: tasks; align-items: stretch; }
    .container > .card .top-bar { margin-bottom: auto; }
    .container > .card .btn-row { margin-top: auto; }
    .timer-display { font-size: clamp(4rem, 9vw, 8rem); margin: 10px 0 14px; }
    .timer-status { font-size: 0.95rem; }
    .subject-select { font-size: 1rem; padding: 10px; }
    .btn-start { font-size: 1.25rem; padding: 16px; }
    .btn-reset-small { font-size: 0.85rem; padding: 8px; }
    .btn-row .btn-thief { margin-top: 12px; }
    .memo-list { max-height: none; flex: 1; min-height: 0; overflow-y: auto; }
    #app-tasks .task-list { flex: 1; min-height: 0; overflow-y: auto; }
    .btn-install { position: fixed; right: 16px; bottom: 16px; width: auto; padding: 8px 14px; background: #0f171e; z-index: 50; }
    .modal-content.modal-wide { max-width: 1100px; width: 92%; max-height: 92vh; display: grid; grid-template-columns: 1.4fr 1fr; column-gap: 24px; align-content: start; }
    .modal-wide > * { grid-column: 1; }
    .modal-wide .detail-box { grid-column: 2; grid-row: 1 / span 5; margin-top: 0; border-top: none; border-left: 1px solid #1e293b; padding: 0 0 0 20px; font-size: 0.95rem; }
    .modal-wide .calendar-grid { font-size: 0.95rem; }
    .modal-wide .day-cell { min-height: 84px; }
    .modal-wide .pomo-badge { font-size: 0.9rem; }
    .modal-wide .study-time { font-size: 0.8rem; }
    .modal-content.trash-wide { max-width: 860px; }
    .trash-cols { grid-template-columns: 1fr 1fr; }
}
.modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.75); backdrop-filter: blur(3px); z-index: 100; justify-content: center; align-items: center; }
.modal-content { background: #0f171e; border: 1px solid #00f3ff; box-shadow: 0 0 15px rgba(0,243,255,0.2); border-radius: 14px; padding: 20px 16px 16px; width: 90%; max-width: 380px; max-height: 85vh; overflow-y: auto; position: relative; }
.modal-close { position: absolute; top: 6px; right: 8px; z-index: 20; background: none; border: none; color: #94a3b8; font-size: 1.1rem; cursor: pointer; }
.calendar-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; padding-right: 34px; gap: 8px; }
.calendar-title { font-size: 0.88rem; font-weight: 700; color: #00f3ff; }
.calendar-nav { background: none; border: none; color: #94a3b8; cursor: pointer; position: relative; z-index: 21; min-width: 30px; min-height: 30px; padding: 4px 8px; touch-action: manipulation; }
.calendar-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; text-align: center; font-size: 0.78rem; }
.day-name { color: #64748b; font-weight: 600; padding-bottom: 2px; }
.day-cell { background-color: #080c10; border: 1px solid #1e293b; border-radius: 4px; padding: 4px 1px; min-height: 66px; display: flex; flex-direction: column; justify-content: flex-start; gap: 2px; align-items: center; cursor: pointer; }
.day-cell.empty { border: none; background: none; cursor: default; }
.day-cell.selected { border-color: #00f3ff; background-color: #1a2a3a; }
.pomo-badge { font-size: 0.72rem; color: #00f3ff; font-weight: 700; }
.study-time { font-size: 0.64rem; color: #94a3b8; font-weight: 600; }
.detail-box { margin-top: 8px; padding-top: 8px; border-top: 1px solid #1e293b; font-size: 0.8rem; }
.detail-title { color: #00f3ff; font-weight: 700; margin-bottom: 4px; }
.detail-list { list-style: square; padding-left: 14px; margin: 0; color: #cbd5e1; }
.detail-list li { margin-bottom: 2px; }
.detail-sub { color: #94a3b8; font-size: 0.72rem; font-weight: 700; margin: 8px 0 3px; }
.session-time { color: #00f3ff; font-weight: 700; font-variant-numeric: tabular-nums; }
.thief-title { font-size: 0.95rem; font-weight: 700; color: #00f3ff; margin-bottom: 12px; text-align: center; }
.rank-list { list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 8px; }
.rank-item { display: flex; justify-content: space-between; align-items: center; background: #080c10; border: 1px solid #1e293b; padding: 8px 12px; border-radius: 6px; font-size: 0.85rem; }
.rank-num { font-weight: 800; color: #00f3ff; width: 20px; }
.rank-word { flex: 1; margin-left: 8px; }
.rank-count { font-weight: 700; color: #94a3b8; }
.page-header { width: 100%; display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; gap: 8px; }
.btn-back { background: none; border: 1px solid #00f3ff; color: #00f3ff; padding: 6px 12px; border-radius: 6px; font-size: 0.82rem; font-weight: 700; cursor: pointer; }
.btn-back:hover { background: #00f3ff; color: #080c10; }
.page-title { font-size: 1.05rem; font-weight: 800; color: #00f3ff; }
.task-form { width: 100%; display: flex; flex-direction: column; gap: 8px; margin-bottom: 12px; background: #080c10; border: 1px solid #1e293b; border-radius: 10px; padding: 10px; }
.task-form-row { display: flex; gap: 6px; }
.task-input, .task-select { background: #0f171e; border: 1px solid #1e293b; color: #fff; border-radius: 6px; padding: 7px 8px; font-size: 0.85rem; outline: none; color-scheme: dark; }
.task-input { flex: 1; min-width: 0; }
.task-input:focus, .task-select:focus { border-color: #00f3ff; }
.task-list { width: 100%; list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 6px; }
.task-item { display: flex; align-items: center; gap: 8px; background: #080c10; border: 1px solid #1e293b; border-radius: 8px; padding: 8px 10px; }
.task-item.overdue { border-color: #5b2a35; }
.task-check { accent-color: #00f3ff; cursor: pointer; flex: 0 0 auto; }
.task-body { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.task-when { font-size: 0.72rem; color: #00f3ff; font-weight: 700; cursor: pointer; touch-action: manipulation; user-select: none; }
.task-text { font-size: 0.85rem; color: #e2e8f0; word-break: break-word; }
.task-empty { text-align: center; color: #64748b; font-size: 0.82rem; padding: 14px 0; }
.check-list { list-style: none; padding: 0; margin: 0 0 10px; display: flex; flex-direction: column; gap: 8px; }
.check-item { background: #080c10; border: 1px solid #1e293b; border-radius: 8px; padding: 8px 10px; }
.check-item.bad { border-color: #5b2a35; }
.check-label { font-size: 0.85rem; font-weight: 700; color: #e2e8f0; }
.check-detail { font-size: 0.75rem; color: #94a3b8; margin-top: 3px; word-break: break-word; }
.btn-recheck { width: 100%; background: transparent; color: #00f3ff; border: 1px solid #00f3ff; padding: 7px; font-size: 0.8rem; font-weight: 700; border-radius: 6px; cursor: pointer; }
.btn-recheck:hover { background: #00f3ff; color: #080c10; }
.upcoming-card { width: 100%; background: #0f171e; border: 1px solid #1e4a55; border-radius: 14px; padding: 10px 12px; }
.upcoming-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
.upcoming-title { font-size: 0.82rem; font-weight: 800; color: #00f3ff; }
.upcoming-more { background: none; border: none; color: #94a3b8; font-size: 0.72rem; cursor: pointer; padding: 2px 0; }
.upcoming-more:hover { color: #00f3ff; }
.upcoming-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 5px; }
.upcoming-item { display: flex; align-items: center; gap: 8px; background: #080c10; border: 1px solid #1e293b; border-radius: 8px; padding: 6px 9px; }
.upcoming-item.soon { border-color: #6b4a1e; }
.upcoming-item.overdue { border-color: #5b2a35; }
.upcoming-check { accent-color: #00f3ff; cursor: pointer; flex: 0 0 auto; }
.upcoming-body { flex: 1; min-width: 0; }
.upcoming-when { font-size: 0.7rem; font-weight: 700; color: #00f3ff; }
.upcoming-item.soon .upcoming-when { color: #ffb347; }
.upcoming-item.overdue .upcoming-when { color: #ff6b6b; }
.upcoming-text { font-size: 0.82rem; color: #e2e8f0; word-break: break-word; }
.btn-install { width: 100%; background: transparent; border: 1px dashed #1e4a55; color: #94a3b8; padding: 8px; border-radius: 8px; font-size: 0.8rem; font-weight: 700; cursor: pointer; }
.btn-install:hover { color: #00f3ff; border-color: #00f3ff; }
</style>
</head>
<body>
<div class="app-grid">
<div id="app-timer" class="page active">
  <div class="container">
    <div class="upcoming-card" id="upcomingBox" style="display: none;">
      <div class="upcoming-head">
        <div class="upcoming-title">⏰ 임박한 할 일</div>
        <button class="upcoming-more only-mobile" onclick="switchPage('app-tasks')">전체 보기 ›</button>
      </div>
      <ul class="upcoming-list" id="upcomingList"></ul>
    </div>
    <div class="card">
      <div class="top-bar">
        <button class="icon-btn" onclick="openModal('calendarModal')" title="달력 보기">📅</button>
        <div class="pomo-count-text">오늘 성공: <span class="count-num" id="todayPomo">0</span>회</div>
        <div class="top-actions">
          <button class="icon-btn" onclick="openTrash()" title="휴지통">🗑</button>
          <button class="icon-btn only-mobile" onclick="switchPage('app-tasks')" title="할 일 기록">📝</button>
        </div>
      </div>
      <select id="pomoSubject" class="subject-select">
        <option value="독서와 작문">독서와 작문</option>
        <option value="영어II">영어II</option>
        <option value="미적분I">미적분I</option>
        <option value="확률과 통계">확률과 통계</option>
        <option value="생명과학">생명과학</option>
        <option value="기타">기타</option>
      </select>
      <select id="pomoDuration" class="subject-select" onchange="changeDuration()">
        <option value="10">10분</option>
        <option value="15">15분</option>
        <option value="20">20분</option>
        <option value="25">25분</option>
        <option value="30">30분</option>
      </select>
      <div class="timer-display" id="timer">25:00</div>
      <div class="timer-status" id="timerStatus"></div>
      <button class="btn-start" onclick="startTimer()">시작</button>
      <button class="btn-reset-small" onclick="resetTimer()">초기화</button>
      <div class="btn-row">
        <button class="btn-thief" onclick="runCheck()">🔧 상태 확인</button>
        <button class="btn-thief" onclick="changeStorage()">🔗 저장소 바꾸기</button>
      </div>
    </div>
    <div class="card memo-section">
      <div class="input-box">
        <input type="text" id="wishInput" placeholder="딴생각 적기..." onkeypress="if(event.key==='Enter') addWish()">
        <button class="btn-add" onclick="addWish()">적기</button>
      </div>
      <ul class="memo-list" id="memoList"></ul>
      <button class="btn-thief" onclick="showThiefRank()">내 집중력 도둑은? 🔍</button>
    </div>
    <button class="btn-install" id="installBtn" style="display: none;" onclick="installApp()">📲 앱으로 설치</button>
  </div>
</div>

<div id="app-tasks" class="page">
  <div class="card">
    <div class="page-header">
      <button class="btn-back only-mobile" onclick="switchPage('app-timer')">← 타이머</button>
      <div class="page-title">할 일 기록 📝</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script>
// 코드를 고칠 때마다 이 버전 문자열을 바꿔서 올리면, '상태 확인'에서 새 버전 반영 여부를 알 수 있어요
const APP_VERSION = '2026-10-21-i';

// ── 데이터 저장: Firebase Realtime Database (어느 기기에서 열어도 같은 데이터) ──
const SYNC_CONFIG = {
    apiKey: "AIzaSyDpvnO3YUB2KyHVuNQSt6JoBxH9GBQYNB4",
    authDomain: "pomodoro-app-763ce.firebaseapp.com",
    databaseURL: "https://pomodoro-app-763ce-default-rtdb.firebaseio.com",
    projectId: "pomodoro-app-763ce",
    storageBucket: "pomodoro-app-763ce.firebasestorage.app",
    messagingSenderId: "818555826060",
    appId: "1:818555826060:web:3a42770c6c440ccea830a9"
};
const SYNC_ID_KEY = 'pomodoro_sync_id';
let syncReady = false;
let baseRef = null;

function getSyncId() {
    let id = localStorage.getItem(SYNC_ID_KEY);
    if (!id) {
        id = prompt('기기 간 동기화용 코드를 정해주세요.\n(같은 코드를 모든 기기에 입력하면 데이터가 공유됩니다)') || '';
        if (id) localStorage.setItem(SYNC_ID_KEY, id);
    }
    return id;
}
async function initCloudSync() {
    try {
        if (!window.firebase) { setTimerStatus('⚠ Firebase 스크립트를 불러오지 못했어요.'); return; }
        if (!firebase.apps.length) firebase.initializeApp(SYNC_CONFIG);
        const id = getSyncId();
        if (!id) { setTimerStatus('동기화 코드가 설정되지 않았어요.'); return; }
        await firebase.auth().signInAnonymously();
        baseRef = firebase.database().ref('pomodoroUsers/' + encodeURIComponent(id));
        syncReady = true;
        // 다른 기기에서 바뀐 내용이 들어오면 실시간으로 화면 갱신
        baseRef.child('pomodoro_app_data').on('value', () => { updateViews(); });
        baseRef.child('pomodoro_tasks').on('value', (snap) => {
            tasksCache = snap.val() || {};
            renderTasks();
            renderUpcoming();
            renderArchive();
        });
        // 취소한 기록(휴지통)
        baseRef.child('pomodoro_trash').on('value', (snap) => {
            trashCache = snap.val() || {};
            purgeExpiredTrash();
            renderTrash();
        });
        // 창을 새로 열 때(또는 다른 기기에서) 저장된 종료 시각을 즉시 반영
        baseRef.child('pomodoro_timer').on('value', (snap) => {
            applyRemoteTimerState(snap.val());
        });
    } catch (e) {
        console.warn('동기화 초기화 실패:', e);
        setTimerStatus('⚠ 동기화 연결에 실패했어요. (Firebase 설정/네트워크 확인)');
    }
}

// ── 날짜/시간 도우미 ──
const DAY_NAMES = ['일', '월', '화', '수', '목', '금', '토'];
function pad2(n) { return String(n).padStart(2, '0'); }
function dateKeyOf(d) { return `${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(d.getDate())}`; }
function getTodayKey() { return dateKeyOf(new Date()); }
function hhmm(d) { return `${pad2(d.getHours())}:${pad2(d.getMinutes())}`; }
function formatNoYear(dateStr) {
    if (!dateStr) return '';
    const parts = dateStr.split('-');
    if (parts.length === 3) return `${parseInt(parts[1])}월 ${parseInt(parts[2])}일`;
    return dateStr;
}

// ── 공부/메모 데이터 ──
// Firebase는 빈 배열을 저장하지 않아서(읽으면 사라짐) 읽을 때마다 형태를 보정합니다.
function toArray(v) {
    if (Array.isArray(v)) return v.filter(x => x != null);
    if (v && typeof v === 'object') return Object.keys(v).sort((a, b) => a - b).map(k => v[k]);
    return [];
}
function normalizeData(raw) {
    const data = (raw && typeof raw === 'object') ? raw : {};
    Object.keys(data).forEach(k => {
        const d = data[k];
        if (!d || typeof d !== 'object') { delete data[k]; return; }
        if (typeof d.pomo !== 'number') d.pomo = 0;
        d.memos = toArray(d.memos);
        d.sessions = toArray(d.sessions);
    });
    return data;
}
function initDayData(data, dateKey) {
    if (!data[dateKey]) data[dateKey] = {};
    const d = data[dateKey];
    if (typeof d.pomo !== 'number') d.pomo = 0;
    if (!Array.isArray(d.memos)) d.memos = [];
    if (!Array.isArray(d.sessions)) d.sessions = [];
    return data;
}
async function getData() {
    if (!syncReady) return {};
    try {
        const snap = await baseRef.child('pomodoro_app_data').once('value');
        return normalizeData(snap.val());
    } catch (e) {
        return {};
    }
}
async function saveData(data) {
    if (!syncReady) return;
    try {
        await baseRef.child('pomodoro_app_data').set(data);
    } catch (e) {
        console.error('저장 실패:', e);
    }
}

function switchPage(pageId) {
    document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
    document.getElementById(pageId).classList.add('active');
    if (pageId === 'app-tasks') renderTasks();
}
async function openModal(id) {
    document.getElementById(id).style.display = 'flex';
    if (id === 'calendarModal') {
        subjectChecked = new Set(SUBJECTS);
        renderSubjectFilter();
        await renderCalendar();
        await renderDetail(selectedDateKey);
    }
}
function closeModal(id) { document.getElementById(id).style.display = 'none'; }

// ── 타이머: '종료 시각(endAt)'을 db에 저장해두고 현재 시각과 비교해 남은 시간을 계산 ──
const BREAK_MIN = 5;
let focusMin = 25;   // 기본 25분 (고른 시간은 저장하지 않아서, 앱을 다시 열거나 초기화하면 25분으로 돌아와요)
let timeLeft = focusMin * 60;
let timerEndAt = null;
let timerSubjectAtStart = null;
let timerDurationMin = focusMin;   // 지금 돌아가는(또는 방금 끝난) 타이머 길이(분)
let timerMode = 'focus';           // 'focus' 또는 'break'
let localTickInterval = null;
let completing = false;

function updateTimerDisplay() {
    const m = Math.floor(timeLeft / 60).toString().padStart(2, '0');
    const s = (timeLeft % 60).toString().padStart(2, '0');
    document.getElementById('timer').textContent = `${m}:${s}`;
}
function setTimerStatus(text) {
    document.getElementById('timerStatus').textContent = text;
}
function setDurationLock(locked) {
    document.getElementById('pomoDuration').disabled = locked;
}
function runningStatusText() {
    return timerMode === 'break' ? '휴식 중... 푹 쉬어요 ☕' : '집중 중... (창을 닫아도 시간은 계속 흘러요)';
}
function changeDuration() {
    if (timerEndAt != null) return;
    focusMin = Number(document.getElementById('pomoDuration').value);
    timerDurationMin = focusMin;
    timeLeft = focusMin * 60;
    updateTimerDisplay();
}
// 이 기기의 타이머를 '대기 상태'로 되돌림
function resetLocalTimer() {
    stopLocalTick();
    timerEndAt = null;
    timerSubjectAtStart = null;
    timerMode = 'focus';
    timerDurationMin = focusMin;
    timeLeft = focusMin * 60;
    document.getElementById('pomoDuration').value = focusMin;
    setDurationLock(false);
    updateTimerDisplay();
    setTimerStatus('');
}
function startLocalTick() {
    if (localTickInterval) return;
    localTickInterval = setInterval(tick, 1000);
    tick();
}
function stopLocalTick() {
    clearInterval(localTickInterval);
    localTickInterval = null;
}
function tick() {
    if (timerEndAt == null) return;
    const remaining = Math.round((timerEndAt - Date.now()) / 1000);
    if (remaining > 0) {
        timeLeft = remaining;
        updateTimerDisplay();
    } else {
        timeLeft = 0;
        updateTimerDisplay();
        handleTimerComplete();
    }
}
// 여러 기기가 동시에 열려 있어도 완료 처리는 한 번만 하도록 '먼저 가져간 기기'만 처리
async function claimCompletion(endAtMs) {
    if (!syncReady) return true;
    try {
        const res = await baseRef.child('pomodoro_timer').transaction((cur) => {
            if (cur && cur.endAt === endAtMs) return null;
            return undefined;
        });
        return !!res.committed;
    } catch (e) {
        return true;
    }
}
async function handleTimerComplete() {
    if (completing) return;
    completing = true;
    stopLocalTick();
    const endAtMs = timerEndAt || Date.now();
    const mode = timerMode;
    const minutes = timerDurationMin;
    const subject = timerSubjectAtStart || document.getElementById('pomoSubject').value;
    const claimed = await claimCompletion(timerEndAt);
    resetLocalTimer();
    if (!claimed) { completing = false; return; }

    if (mode === 'break') {          // 휴식은 기록하지 않음
        completing = false;
        alert('휴식 끝! 다시 집중해 볼까요? 💪');
        return;
    }
    const endD = new Date(endAtMs);
    const startD = new Date(endAtMs - minutes * 60 * 1000);
    const key = dateKeyOf(endD);
    let data = await getData();
    data = initDayData(data, key);
    data[key].pomo += 1;
    data[key].sessions.push({ start: hhmm(startD), end: hhmm(endD), subject, min: minutes });
    await saveData(data);
    await updateViews();
    setTimerStatus(`${focusMin}분 세팅 완료 - 시작 버튼을 누르면 다시 시작돼요`);
    completing = false;
    if (confirm(`[${subject}] ${minutes}분 뽀모도로 완료! 🍅\n${BREAK_MIN}분 휴식 할까요?`)) startTimer('break');
}
async function startTimer(mode) {
    if (timerEndAt != null) return;
    mode = (mode === 'break') ? 'break' : 'focus';   // 시작 버튼 클릭 시 인자가 이벤트가 아니라 비어 있음
    const subject = document.getElementById('pomoSubject').value;
    timerMode = mode;
    timerDurationMin = (mode === 'break') ? BREAK_MIN : focusMin;
    timerSubjectAtStart = subject;
    timeLeft = timerDurationMin * 60;
    timerEndAt = Date.now() + timeLeft * 1000;
    setDurationLock(true);
    setTimerStatus(runningStatusText());
    startLocalTick();
    if (syncReady) {
        try { await baseRef.child('pomodoro_timer').set({ endAt: timerEndAt, subject, duration: timerDurationMin, mode }); } catch (e) { console.error('타이머 저장 실패:', e); }
    }
}
async function resetTimer() {
    focusMin = 25;
    resetLocalTimer();
    if (syncReady) {
        try { await baseRef.child('pomodoro_timer').remove(); } catch (e) {}
    }
}
function applyRemoteTimerState(remote) {
    if (completing) return;
    const remoteEndAt = (remote && remote.endAt) ? remote.endAt : null;
    if (remoteEndAt === timerEndAt) return;
    if (remoteEndAt == null) { resetLocalTimer(); return; }
    timerEndAt = remoteEndAt;
    timerSubjectAtStart = remote.subject || null;
    timerMode = (remote.mode === 'break') ? 'break' : 'focus';
    timerDurationMin = remote.duration || 25;     // 예전 기록(길이 없음)은 25분
    if (timerMode === 'focus') {
        if (timerSubjectAtStart) document.getElementById('pomoSubject').value = timerSubjectAtStart;
        document.getElementById('pomoDuration').value = timerDurationMin;
    }
    setDurationLock(true);
    const remaining = Math.round((timerEndAt - Date.now()) / 1000);
    if (remaining > 0) {
        timeLeft = remaining;
        updateTimerDisplay();
        setTimerStatus(runningStatusText());
        startLocalTick();
    } else {
        timeLeft = 0;
        updateTimerDisplay();
        handleTimerComplete();
    }
}

// ── 딴생각 메모 ──
async function addWish() {
    const input = document.getElementById('wishInput');
    const text = input.value.trim();
    if (!text) return;
    const today = getTodayKey();
    let data = await getData();
    data = initDayData(data, today);
    data[today].memos.unshift(text);
    await saveData(data);
    input.value = '';
    await updateViews();
}
async function deleteWish(index) {
    const today = getTodayKey();
    let data = await getData();
    if (data[today] && data[today].memos) {
        data[today].memos.splice(index, 1);
        await saveData(data);
        await updateViews();
    }
}
async function renderTodayMemos() {
    const today = getTodayKey();
    const data = await getData();            // 먼저 불러온 뒤 한 번에 그림(동시 호출 시 중복 방지)
    const todayData = data[today] || { pomo: 0, memos: [] };
    document.getElementById('todayPomo').textContent = todayData.pomo;
    const ul = document.getElementById('memoList');
    ul.innerHTML = '';
    todayData.memos.forEach((text, i) => {
        const li = document.createElement('li');
        li.className = 'memo-item';
        const span = document.createElement('span');
        span.textContent = text;
        const btn = document.createElement('button');
        btn.className = 'btn-del';
        btn.textContent = '✕';
        btn.onclick = () => deleteWish(i);
        li.appendChild(span);
        li.appendChild(btn);
        ul.appendChild(li);
    });
}
const TARGET_WORDS = ['야구', '노래', '유튜브', '게임'];
async function showThiefRank() {
    const data = await getData();
    const counts = Object.fromEntries(TARGET_WORDS.map(w => [w, 0]));
    Object.values(data).forEach(day => {
        (day.memos || []).forEach(memo => {
            TARGET_WORDS.forEach(word => {
                if (String(memo).includes(word)) counts[word]++;
            });
        });
    });
    const sorted = Object.entries(counts).sort((a, b) => b[1] - a[1]);
    const rankList = document.getElementById('rankList');
    rankList.innerHTML = '';
    sorted.forEach(([word, count], idx) => {
        const li = document.createElement('li');
        li.className = 'rank-item';
        li.innerHTML = `
            <span class="rank-num">${idx + 1}</span>
            <span class="rank-word">${word}</span>
            <span class="rank-count">${count}회</span>
        `;
        rankList.appendChild(li);
    });
    openModal('thiefModal');
}

// ── 캘린더 ──
let currentDate = new Date(new Date().getFullYear(), new Date().getMonth(), 1);
let selectedDateKey = getTodayKey();
async function changeMonth(delta) {
    currentDate.setMonth(currentDate.getMonth() + delta);
    await renderCalendar();
}
async function selectDate(dateStr) {
    selectedDateKey = dateStr;
    await renderCalendar();
    await renderDetail(dateStr);
}
// ── 공부 시간 계산 ──
// 세션 하나의 길이(분): 저장된 min 값이 있으면 사용, 없으면 시작~끝 시각으로 계산, 그래도 안 되면 25분
function sessionMinutes(s) {
    if (typeof s.min === 'number' && s.min > 0) return s.min;
    const a = String(s.start).split(':').map(Number);
    const b = String(s.end).split(':').map(Number);
    if (a.length === 2 && b.length === 2 && !a.concat(b).some(isNaN)) {
        let diff = (b[0] * 60 + b[1]) - (a[0] * 60 + a[1]);
        if (diff <= 0) diff += 24 * 60;
        return diff;
    }
    return 25;
}
// ── 과목 체크리스트: 체크된 과목만 합산 (기본은 전부 체크) ──
const SUBJECTS = Array.from(document.querySelectorAll('#pomoSubject option')).map(o => o.value);
let subjectChecked = new Set(SUBJECTS);
function isAllChecked() { return subjectChecked.size === SUBJECTS.length; }
function subjectOf(s) { return SUBJECTS.includes(s.subject) ? s.subject : '기타'; }   // 목록에 없는 과목은 '기타'
// 하루 횟수/공부 시간(분). 과목을 알 수 없는 '이전 기록'(시간 기록 없음)은 전체 체크일 때만 포함(1회=25분)
function dayStats(day) {
    const sessions = (day.sessions || []).filter(s => subjectChecked.has(subjectOf(s)));
    const legacy = isAllChecked() ? Math.max(0, (day.pomo || 0) - (day.sessions || []).length) : 0;
    return { count: sessions.length + legacy, min: sessions.reduce((sum, s) => sum + sessionMinutes(s), 0) + legacy * 25 };
}
function renderSubjectFilter() {
    const box = document.getElementById('subjectFilter');
    box.innerHTML = '';
    SUBJECTS.forEach(name => {
        const label = document.createElement('label');
        label.className = 'subject-chip' + (subjectChecked.has(name) ? '' : ' off');
        const cb = document.createElement('input');
        cb.type = 'checkbox';
        cb.checked = subjectChecked.has(name);
        cb.onchange = async () => {
            if (cb.checked) subjectChecked.add(name); else subjectChecked.delete(name);
            label.classList.toggle('off', !cb.checked);
            await renderCalendar();
            await renderDetail(selectedDateKey);
        };
        label.appendChild(cb);
        label.appendChild(document.createTextNode(name));
        box.appendChild(label);
    });
}
// 글자를 입력받는 창 (입력값 또는 닫으면 null)
function askInput(title, detail, value) {

        field.focus();
        field.select();
    });
}
// 저장소 연결 바꾸기: 동기화 코드를 새로 입력해서 그 코드의 기록으로 연결 (이전 기록은 그대로 남아 있음)

// 가운데에 큰 질문을 띄우는 확인창 (확인 true / 취소 false)
function askConfirm(title, detail, yesText, noText) {

function fmtMin(m) {
    const h = Math.floor(m / 60), r = m % 60;
    if (h === 0) return `${r}분`;
    return r ? `${h}시간 ${r}분` : `${h}시간`;
}
function fmtMinShort(m) {
    const h = Math.floor(m / 60), r = m % 60;
    if (h === 0) return `${r}m`;
    return r ? `${h}h${r}m` : `${h}h`;
}

// ── 공부 기록 취소: 지우지 않고 휴지통으로 보냄 (idx가 -1이면 '시간 기록 없음' 항목) ──
let trashCache = {};
function newId() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 6); }
async function cancelSession(dateStr, idx, label) {
    if (!syncReady) { alert('저장소에 연결되지 않아 취소할 수 없어요.'); return; }
    if (!await askConfirm('이 공부 기록을 취소할까요?', `${label}\n뽀모도로 횟수도 1회 줄어요. (휴지통에서 되살릴 수 있어요)`)) return;
    const data = await getData();
    const d = data[dateStr];
    if (!d) return;
    let entry;
    if (idx >= 0) {
        if (idx >= d.sessions.length) return;
        const s = d.sessions.splice(idx, 1)[0];
        entry = { date: dateStr, start: s.start, end: s.end, subject: s.subject || '', min: sessionMinutes(s) };
    } else if (d.pomo > d.sessions.length) {
        entry = { date: dateStr, legacy: true };
    } else {
        return;
    }
    entry.deletedAt = Date.now();
    d.pomo = Math.max(0, d.pomo - 1);
    try {
        await baseRef.child('pomodoro_trash/' + newId()).set(entry);   // 휴지통에 먼저 넣고, 성공해야 기록에서 뺌
    } catch (e) {
        console.error('휴지통 저장 실패:', e);
        alert('휴지통에 옮기지 못해서 취소하지 않았어요. 다시 시도해 주세요.');
        return;
    }
    await saveData(data);
    await updateViews();
}
const TRASH_MS = 14 * 24 * 60 * 60 * 1000;               // 휴지통 보관 기간: 14일
function trashItems() {
    const now = Date.now();
    return Object.keys(trashCache)
        .map(id => Object.assign({ id }, trashCache[id]))
        .filter(t => t && t.date && !(t.deletedAt && now - t.deletedAt > TRASH_MS))
        .sort((a, b) => (b.deletedAt || 0) - (a.deletedAt || 0));
}
function purgeExpiredTrash() {                               // 14일 지난 것을 한 번에 비움
    if (!syncReady) return;
    const now = Date.now(), upd = {};
    Object.keys(trashCache).forEach(id => {
        const t = trashCache[id];
        if (t && t.deletedAt && now - t.deletedAt > TRASH_MS) upd[id] = null;
    });
    if (Object.keys(upd).length) baseRef.child('pomodoro_trash').update(upd).catch(e => console.error(e));
}
function trashLabel(t) {
    if (t.type === 'task') return `📝 할 일 · ${dateLabel(t.date)} ${t.period || 1}교시까지 · ${t.text}${t.done ? ' (완료됨)' : ''}`;
    if (t.legacy) return `📚 공부 기록 · ${formatNoYear(t.date)} · 시간 기록 없음 (이전 기록) 1회`;
    return `📚 공부 기록 · ${formatNoYear(t.date)} ${t.start} ~ ${t.end} · ${t.subject || '과목 미지정'} (${fmtMin(t.min || 25)})`;
}
function trashRow(t) {
    const li = document.createElement('li');
    li.className = 'trash-item';
    const main = document.createElement('div');
    main.textContent = trashLabel(t);
    li.appendChild(main);
    if (t.deletedAt) {
        const dd = new Date(t.deletedAt);
        const left = Math.max(1, Math.ceil((t.deletedAt + TRASH_MS - Date.now()) / 86400000));
        const meta = document.createElement('div');
        meta.className = 'trash-meta';
        meta.textContent = `${t.type === 'task' ? '지운' : '취소한'} 때: ${dd.getMonth() + 1}월 ${dd.getDate()}일 ${hhmm(dd)} · ${left}일 뒤 자동 삭제`;
        li.appendChild(meta);
    }
    const actions = document.createElement('div');
    actions.className = 'trash-actions';
    const rb = document.createElement('button');
    rb.className = 'trash-restore';
    rb.textContent = '↩ 되살리기';
    rb.onclick = () => restoreTrash(t.id);
    const pb = document.createElement('button');
    pb.className = 'trash-purge';
    pb.textContent = '완전 삭제';
    pb.onclick = () => purgeTrash(t.id);
    actions.appendChild(rb);
    actions.appendChild(pb);
    li.appendChild(actions);
    return li;
}
function fillTrash(ulId, titleId, title, items) {
    document.getElementById(titleId).textContent = `${title} (${items.length})`;
    const ul = document.getElementById(ulId);
    ul.innerHTML = '';
    if (items.length === 0) {
        const li = document.createElement('li');
        li.className = 'task-empty';
        li.textContent = '비어 있어요.';
        ul.appendChild(li);
        return;
    }
    items.forEach(t => ul.appendChild(trashRow(t)));
}
function renderTrash() {
    const items = trashItems();
    fillTrash('trashStudyList', 'trashStudyTitle', '📚 공부 기록', items.filter(t => t.type !== 'task'));
    fillTrash('trashTaskList', 'trashTaskTitle', '📝 할 일', items.filter(t => t.type === 'task'));
    document.getElementById('trashEmptyBtn').style.display = items.length ? 'block' : 'none';
}
function openTrash() {
    renderTrash();
    openModal('trashModal');
}
async function restoreTrash(id) {
    const t = trashCache[id];
    if (!t || !syncReady) return;
    if (t.type === 'task') {                                   // 지웠던 할 일 되살리기
        try {
            await baseRef.child('pomodoro_tasks/' + (t.taskId || newId())).set({ date: t.date, period: t.period || 1, text: t.text, done: !!t.done });
            await baseRef.child('pomodoro_trash/' + id).remove();
        } catch (e) { console.error(e); alert('되살리지 못했어요. 다시 시도해 주세요.'); }
        return;
    }
    let data = await getData();                                // 취소했던 공부 기록 되살리기
    data = initDayData(data, t.date);
    const d = data[t.date];
    d.pomo += 1;
    if (!t.legacy) d.sessions.push({ start: t.start, end: t.end, subject: t.subject || '', min: t.min || 25 });
    await saveData(data);                                      // 기록에 먼저 되돌린 뒤 휴지통에서 뺌
    try { await baseRef.child('pomodoro_trash/' + id).remove(); } catch (e) { console.error(e); }
    await updateViews();
}
async function purgeTrash(id) {
    if (!syncReady || !trashCache[id]) return;
    if (!confirm(`${trashLabel(trashCache[id])}\n\n완전히 삭제할까요? 되돌릴 수 없어요.`)) return;
    try { await baseRef.child('pomodoro_trash/' + id).remove(); } catch (e) { console.error(e); }
}
async function emptyTrash() {
    if (!syncReady) return;
    const n = trashItems().length;
    if (n === 0) return;
    if (!confirm(`휴지통의 기록 ${n}개를 모두 완전히 삭제할까요? 되돌릴 수 없어요.`)) return;
    try { await baseRef.child('pomodoro_trash').remove(); } catch (e) { console.error(e); }
}
function makeEditBtn(onClick) {

// 기록 입력 창: withTime이면 시작 시각·공부 시간까지, 아니면 과목만 (저장하면 {subject,start,min}, 닫으면 null)
function askSession(opts) {
    return new Promise(resolve => {
        const modal = document.getElementById('sessionModal');
        const yes = document.getElementById('sessionYes');
        const no = document.getElementById('sessionNo');
        const sel = document.getElementById('sessionSubject');
        const start = document.getElementById('sessionStart');
        const min = document.getElementById('sessionMin');
        document.getElementById('sessionTitle').textContent = opts.title;
        sel.innerHTML = '';
        SUBJECTS.forEach(n => { const o = document.createElement('option'); o.value = n; o.textContent = n; sel.appendChild(o); });
        sel.value = SUBJECTS.includes(opts.subject) ? opts.subject : '기타';
        document.getElementById('sessionStartRow').style.display = opts.withTime ? 'flex' : 'none';
        document.getElementById('sessionMinRow').style.display = opts.withTime ? 'flex' : 'none';
        start.value = hhmm(new Date());
        min.value = 25;
        const done = (v) => { modal.style.display = 'none'; yes.onclick = no.onclick = modal.onclick = null; resolve(v); };
        yes.onclick = () => {
            const m = Math.round(Number(min.value));
            if (opts.withTime && (!start.value || !(m >= 1 && m <= 300))) { alert('시작 시각과 공부 시간(1~300분)을 확인해 주세요.'); return; }
            done({ subject: sel.value, start: start.value, min: m });
        };
        no.onclick = () => done(null);
        modal.onclick = (e) => { if (e.target === modal) done(null); };
        modal.style.display = 'flex';
    });
}
async function editSessionSubject(dateStr, idx) {
    if (!syncReady) return;
    const data = await getData();
    const d = data[dateStr];
    const s = d && d.sessions[idx];
    if (!s) return;
    const r = await askSession({ title: '과목 바꾸기', subject: subjectOf(s), withTime: false });
    if (!r || r.subject === s.subject) return;
    s.subject = r.subject;
    await saveData(data);
    await updateViews();
}
async function addManualSession() {
    if (!syncReady) { alert('저장소에 연결되지 않아 추가할 수 없어요.'); return; }
    const dateStr = selectedDateKey;
    const r = await askSession({ title: `${formatNoYear(dateStr)}에 뽀모도로 추가`, subject: document.getElementById('pomoSubject').value, withTime: true });
    if (!r) return;
    const [h, m] = r.start.split(':').map(Number);
    const endTotal = (h * 60 + m + r.min) % 1440;
    const end = `${pad2(Math.floor(endTotal / 60))}:${pad2(endTotal % 60)}`;
    let data = await getData();
    data = initDayData(data, dateStr);
    data[dateStr].pomo += 1;
    data[dateStr].sessions.push({ start: r.start, end, subject: r.subject, min: r.min });
    await saveData(data);
    await updateViews();
}

    const btn = document.createElement('button');
    btn.className = 'btn-del session-del';
    btn.textContent = '✕';
    btn.title = '기록 취소';
    btn.onclick = onClick;
    return btn;
}

async function renderDetail(dateStr) {
    const data = await getData();
    const day = data[dateStr] || { pomo: 0, memos: [], sessions: [] };
    document.getElementById('detailBox').style.display = 'block';
    const st = dayStats(day);

    // 공부 기록: 몇 시~몇 시에 어떤 과목 (✕로 취소 가능)

    sessionList.innerHTML = '';
    const sessions = day.sessions
        .map((s, i) => ({ s, i }))
        .filter(({ s }) => subjectChecked.has(subjectOf(s)))
        .sort((a, b) => String(a.s.start).localeCompare(String(b.s.start)));
    sessions.forEach(({ s, i }) => {
        const li = document.createElement('li');

        time.textContent = `${s.start} ~ ${s.end}`;

        li.appendChild(makeCancelBtn(() => cancelSession(dateStr, i, `${formatNoYear(dateStr)} ${s.start} ~ ${s.end} · ${s.subject || '과목 미지정'}`)));
        sessionList.appendChild(li);
    });
    const legacy = isAllChecked() ? day.pomo - day.sessions.length : 0;   // 시간 기록 기능 이전에 쌓인 횟수(과목 모름)
    if (legacy > 0) {
        const li = document.createElement('li');

        sessionList.appendChild(li);
    }
    if (sessionList.children.length === 0) {
        sessionList.innerHTML = isAllChecked() ? '<li>공부 기록이 없습니다.</li>' : '<li>선택한 과목의 공부 기록이 없습니다.</li>';
    }

    // 딴생각 메모

        detailList.innerHTML = '<li>메모가 없습니다.</li>';
    } else {
        day.memos.forEach(m => {
            const li = document.createElement('li');
            li.textContent = m;
            detailList.appendChild(li);
        });
    }
}
async function renderCalendar() {
    const data = await getData();            // 먼저 불러온 뒤 한 번에 그림(동시 호출 시 중복 방지)
    const month = currentDate.getMonth();
    document.getElementById('calendarMonth').textContent = `${currentDate.getFullYear()}년 ${month + 1}월`;
    const grid = document.getElementById('calendarGrid');
    grid.innerHTML = '';
    DAY_NAMES.forEach(d => {
        const div = document.createElement('div');
        div.className = 'day-name';
        div.textContent = d;
        grid.appendChild(div);
    });
    const year = currentDate.getFullYear();
    const firstDay = new Date(year, month, 1).getDay();
    const lastDate = new Date(year, month + 1, 0).getDate();
    for (let i = 0; i < firstDay; i++) {
        const div = document.createElement('div');
        div.className = 'day-cell empty';
        grid.appendChild(div);
    }
    let monthCount = 0, monthMin = 0;
    for (let d = 1; d <= lastDate; d++) {
        const dayStr = `${year}-${pad2(month + 1)}-${pad2(d)}`;
        const dayData = data[dayStr] || { pomo: 0, sessions: [] };
        const div = document.createElement('div');
        div.className = 'day-cell' + (dayStr === selectedDateKey ? ' selected' : '');
        div.onclick = () => selectDate(dayStr);
        let html = `<span>${d}</span>`;
        const st = dayStats(dayData);
        monthCount += st.count;
        monthMin += st.min;
        if (st.count > 0) {
            html += `<span class="pomo-badge">🍅${st.count}</span>`;
            html += `<span class="study-time">${fmtMinShort(st.min)}</span>`;
        }
        div.innerHTML = html;
        grid.appendChild(div);
    }
    const excluded = SUBJECTS.filter(x => !subjectChecked.has(x));
    document.getElementById('monthSummary').textContent =
        `${month + 1}월 합계: ${fmtMin(monthMin)} · 🍅${monthCount}회` + (excluded.length ? `\n제외한 과목: ${excluded.join(', ')}` : '');
}

        .map(id => Object.assign({ id }, tasksCache[id]))
        .filter(t => t && t.done && t.text)
        .sort((a, b) => (b.doneAt || 0) - (a.doneAt || 0));
    ul.innerHTML = '';
    if (items.length === 0) {
        const li = document.createElement('li');
        li.className = 'task-empty';
        li.textContent = '아직 끝낸 일이 없어요.';
        ul.appendChild(li);
        return;
    }
    items.forEach(t => {
        const li = document.createElement('li');
        li.className = 'trash-item';
        const main = document.createElement('div');
        main.textContent = '✅ ' + t.text;
        const meta = document.createElement('div');
        meta.className = 'trash-meta';
        let info = `${dateLabel(t.date)} ${t.period || 1}교시까지`;
        if (t.doneAt) { const dd = new Date(t.doneAt); info += ` · 완료: ${dd.getMonth() + 1}월 ${dd.getDate()}일`; }
        meta.textContent = info;
        const actions = document.createElement('div');
        actions.className = 'trash-actions';
        const rb = document.createElement('button');
        rb.className = 'trash-restore';
        rb.textContent = '↩ 다시 할 일로';
        rb.onclick = () => toggleTask(t.id, false);
        const pb = document.createElement('button');
        pb.className = 'trash-purge';
        pb.textContent = '휴지통으로';
        pb.onclick = () => deleteTask(t.id);
        actions.appendChild(rb);
        actions.appendChild(pb);
        li.appendChild(main);
        li.appendChild(meta);
        li.appendChild(actions);
        ul.appendChild(li);
    });
}
async function deleteTask(id) {                              // 지우지 않고 휴지통으로 보냄
    const t = tasksCache[id];
    if (!syncReady || !t) return;
    try {
        await baseRef.child('pomodoro_trash/' + newId()).set({ type: 'task', taskId: id, date: t.date, period: t.period || 1, text: t.text, done: !!t.done, deletedAt: Date.now() });
        await baseRef.child('pomodoro_tasks/' + id).remove();   // 휴지통에 들어간 뒤에만 지움
    } catch (e) {
        console.error(e);
        alert('휴지통으로 옮기지 못해서 지우지 않았어요. 다시 시도해 주세요.');
    }
}

function dateLabel(key) {
    const [y, mo, d] = String(key).split('-').map(Number);
    return `${mo}월 ${d}일 (${DAY_NAMES[new Date(y, mo - 1, d).getDay()]})`;
}
function setTaskDate(key) {
    document.getElementById('taskDate').value = key;
    document.getElementById('taskDateBtn').textContent = '📅 ' + dateLabel(key);
}
async function chooseTaskDate() {
    const v = await pickDate(document.getElementById('taskDate').value);
    if (v) setTaskDate(v);
}
// 큰 달력으로 날짜 고르기 (고른 날짜 'YYYY-MM-DD' 또는 닫으면 null)
function pickDate(initialKey) {
    return new Promise(resolve => {
        const modal = document.getElementById('datePickModal');
        const grid = document.getElementById('datePickGrid');
        const todayKey = getTodayKey();
        const [iy, im] = String(initialKey || todayKey).split('-').map(Number);
        const view = new Date(iy, im - 1, 1);
        const done = (v) => { modal.style.display = 'none'; modal.onclick = null; resolve(v); };
        const draw = () => {
            const y = view.getFullYear(), m = view.getMonth();
            document.getElementById('datePickTitle').textContent = `${y}년 ${m + 1}월`;
            grid.innerHTML = '';
            DAY_NAMES.forEach(n => {
                const div = document.createElement('div');
                div.className = 'day-name';
                div.textContent = n;
                grid.appendChild(div);
            });
            const first = new Date(y, m, 1).getDay();
            const last = new Date(y, m + 1, 0).getDate();
            for (let i = 0; i < first; i++) {
                const div = document.createElement('div');
                div.className = 'day-cell empty';
                grid.appendChild(div);
            }
            for (let d = 1; d <= last; d++) {
                const key = `${y}-${pad2(m + 1)}-${pad2(d)}`;
                const div = document.createElement('div');
                div.className = 'day-cell' + (key === initialKey ? ' selected' : '') + (key === todayKey ? ' today' : '');
                div.textContent = d;
                div.onclick = () => done(key);
                grid.appendChild(div);
            }
        };
        document.getElementById('datePickPrev').onclick = () => { view.setMonth(view.getMonth() - 1); draw(); };
        document.getElementById('datePickNext').onclick = () => { view.setMonth(view.getMonth() + 1); draw(); };
        document.getElementById('datePickToday').onclick = () => done(todayKey);
        document.getElementById('datePickClose').onclick = () => done(null);
        modal.onclick = (e) => { if (e.target === modal) done(null); };
        draw();
        modal.style.display = 'flex';
    });
}

// ── 할 일 수정: 날짜 줄을 두 번 누르면(마우스 더블클릭/터치 두 번 탭) 날짜·교시 변경 ──
let editDraft = null;                 // 수정 중인 할 일 { id, date, period }
let lastTapId = null, lastTapAt = 0;
function onWhenTap(id) {
    const now = Date.now();
    if (lastTapId === id && now - lastTapAt < 400) {
        lastTapId = null; lastTapAt = 0;
        const t = tasksCache[id];
        if (!t) return;
        editDraft = { id, date: t.date, period: Number(t.period) || 1 };
        renderTasks();
    } else {
        lastTapId = id; lastTapAt = now;
    }
}
function saveEditTask() {
    if (!editDraft || !syncReady) return;
    const { id, date, period } = editDraft;
    editDraft = null;
    baseRef.child('pomodoro_tasks/' + id).update({ date, period }).catch(e => console.error('수정 실패:', e));
    renderTasks();
}
function cancelEditTask() { editDraft = null; renderTasks(); }
function buildTaskEditForm() {
    const form = document.createElement('div');
    form.className = 'task-edit';
    const row1 = document.createElement('div');
    row1.className = 'task-form-row';
    const dateBtn = document.createElement('button');
    dateBtn.className = 'task-input date-btn';
    dateBtn.textContent = '📅 ' + dateLabel(editDraft.date);
    dateBtn.onclick = async () => {
        const v = await pickDate(editDraft && editDraft.date);
        if (v && editDraft) { editDraft.date = v; dateBtn.textContent = '📅 ' + dateLabel(v); }
    };
    const sel = document.createElement('select');
    sel.className = 'task-select';
    for (let i = 1; i <= 7; i++) {
        const o = document.createElement('option');
        o.value = i;
        o.textContent = `${i}교시`;
        sel.appendChild(o);
    }
    sel.value = editDraft.period;
    sel.onchange = () => { if (editDraft) editDraft.period = Number(sel.value); };
    row1.appendChild(dateBtn);
    row1.appendChild(sel);
    const row2 = document.createElement('div');
    row2.className = 'task-form-row';
    const save = document.createElement('button');
    save.className = 'btn-add';
    save.textContent = '저장';
    save.onclick = saveEditTask;
    const cancel = document.createElement('button');
    cancel.className = 'btn-add btn-cancel-edit';
    cancel.textContent = '취소';
    cancel.onclick = cancelEditTask;
    row2.appendChild(save);
    row2.appendChild(cancel);
    form.appendChild(row1);
    form.appendChild(row2);
    return form;
}
function renderTasks() {
    const ul = document.getElementById('taskList');
    if (editDraft && !tasksCache[editDraft.id]) editDraft = null;   // 다른 기기에서 지워졌으면 수정 종료
    const items = Object.keys(tasksCache)
        .map(id => Object.assign({ id }, tasksCache[id]))
        .filter(t => t && t.date && t.text && !t.done);
    items.sort((a, b) =>
        String(a.date).localeCompare(String(b.date)) ||
        (a.period || 0) - (b.period || 0));
    ul.innerHTML = '';
    if (items.length === 0) {
        const li = document.createElement('li');
        li.className = 'task-empty';
        li.textContent = '아직 적은 할 일이 없어요.';
        ul.appendChild(li);
        return;
    }
    items.forEach(t => {
        const [y, mo, d] = String(t.date).split('-').map(Number);
        const target = new Date(y, mo - 1, d);
        const { diff, label: dday } = getDday(t.date);
        const li = document.createElement('li');
        li.className = 'task-item' + (t.done ? ' done' : '') + (!t.done && diff < 0 ? ' overdue' : '');
        const cb = document.createElement('input');
        cb.type = 'checkbox';
        cb.className = 'task-check';
        cb.checked = !!t.done;
        cb.onchange = () => toggleTask(t.id, cb.checked);
        const body = document.createElement('div');
        body.className = 'task-body';
        const text = document.createElement('div');
        text.className = 'task-text';
        text.textContent = t.text;
        if (editDraft && editDraft.id === t.id) {
            body.appendChild(buildTaskEditForm());
        } else {
            const when = document.createElement('div');
            when.className = 'task-when';
            when.title = '두 번 누르면 날짜·교시를 바꿀 수 있어요';
            when.textContent = `${mo}월 ${d}일(${DAY_NAMES[target.getDay()]}) ${t.period}교시까지 · ${dday}`;
            when.onclick = () => onWhenTap(t.id);
            body.appendChild(when);
        }
        body.appendChild(text);
        const del = document.createElement('button');
        del.className = 'btn-del';
        del.textContent = '✕';
        del.title = '삭제 (휴지통으로 이동)';
        del.onclick = () => deleteTask(t.id);
        li.appendChild(cb);
        li.appendChild(body);
        li.appendChild(del);
        ul.appendChild(li);
    });
}

// ── 마감까지 남은 날 계산 (할 일 화면/타이머 화면 공통) ──
function getDday(dateStr) {
    const [y, mo, d] = String(dateStr).split('-').map(Number);
    const now = new Date();
    const todayMid = new Date(now.getFullYear(), now.getMonth(), now.getDate());
    const diff = Math.round((new Date(y, mo - 1, d) - todayMid) / 86400000);
    const label = diff === 0 ? '오늘' : (diff > 0 ? `D-${diff}` : `${-diff}일 지남`);
    return { diff, label };
}

// ── 타이머 화면: 임박한 할 일 (안 끝낸 것 중 가장 급한 3개) ──
function renderUpcoming() {
    const box = document.getElementById('upcomingBox');
    const ul = document.getElementById('upcomingList');
    const items = Object.keys(tasksCache)
        .map(id => Object.assign({ id }, tasksCache[id]))
        .filter(t => t && t.date && t.text && !t.done);
    items.sort((a, b) =>
        String(a.date).localeCompare(String(b.date)) ||
        (a.period || 0) - (b.period || 0));
    const top = items.slice(0, 3);
    ul.innerHTML = '';
    if (top.length === 0) { box.style.display = 'none'; return; }
    box.style.display = 'block';
    top.forEach(t => {
        const [y, mo, d] = String(t.date).split('-').map(Number);
        const { diff, label } = getDday(t.date);
        const li = document.createElement('li');
        li.className = 'upcoming-item' + (diff < 0 ? ' overdue' : (diff <= 1 ? ' soon' : ''));
        const cb = document.createElement('input');
        cb.type = 'checkbox';
        cb.className = 'upcoming-check';
        cb.title = '완료';
        cb.onchange = () => toggleTask(t.id, true);
        const body = document.createElement('div');
        body.className = 'upcoming-body';
        const when = document.createElement('div');
        when.className = 'upcoming-when';
        when.textContent = `${mo}월 ${d}일 ${t.period}교시까지 · ${label}`;
        const text = document.createElement('div');
        text.className = 'upcoming-text';
        text.textContent = t.text;
        body.appendChild(when);
        body.appendChild(text);
        li.appendChild(cb);
        li.appendChild(body);
        ul.appendChild(li);
    });
}

// ── 앱으로 설치 (홈 화면에 추가) ──
let deferredInstall = null;
function isStandalone() {
    return window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true;
}
function isIOSDevice() {
    return /iphone|ipad|ipod/i.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
}
function updateInstallBox() {
    const btn = document.getElementById('installBtn');
    btn.style.display = (!isStandalone() && (deferredInstall || isIOSDevice())) ? 'block' : 'none';
}
async function installApp() {
    if (deferredInstall) {
        deferredInstall.prompt();
        try { await deferredInstall.userChoice; } catch (e) {}
        deferredInstall = null;
        updateInstallBox();
        return;
    }
    if (isIOSDevice()) {
        alert('아이폰/아이패드에서 설치하는 방법\n\n1) Safari로 이 페이지를 엽니다\n2) 화면 아래(또는 위)의 공유 버튼(□↑)을 누릅니다\n3) "홈 화면에 추가"를 누릅니다');
    }
}
window.addEventListener('beforeinstallprompt', (e) => {
    e.preventDefault();
    deferredInstall = e;
    updateInstallBox();
});
window.addEventListener('appinstalled', () => { deferredInstall = null; updateInstallBox(); });
if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
    window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js').catch(e => console.warn('서비스 워커 등록 실패:', e));
    });
}

// 저장돼 있던 앱 파일(캐시)을 지우고 최신 파일로 다시 열기 (기록 데이터는 지워지지 않음)
async function hardRefresh() {
    try {
        if ('serviceWorker' in navigator) {
            const regs = await navigator.serviceWorker.getRegistrations();
            await Promise.all(regs.map(r => r.unregister()));
        }
        if (window.caches) {
            const keys = await caches.keys();
            await Promise.all(keys.map(k => caches.delete(k)));
        }
    } catch (e) {}
    location.replace(location.pathname + '?v=' + Date.now());
}

// ── 상태 확인 (앱 버전 · 저장 · 기록 · 타이머) ──
function withTimeout(promise, ms) {
    return Promise.race([
        promise,
        new Promise((_, reject) => setTimeout(() => reject(new Error('서버 응답 없음 (인터넷 연결 확인)')), ms))
    ]);
}
let checking = false;
async function runCheck() {
    if (checking) return;          // 확인이 겹쳐 돌면 서로의 테스트 값을 덮어써서 가짜 실패가 나므로 한 번에 하나만 실행
    checking = true;
    try { await runCheckInner(); } finally { checking = false; }
}
async function runCheckInner() {
    const list = document.getElementById('checkList');
    list.innerHTML = '';
    openModal('checkModal');
    const add = (ok, label, detail) => {
        const li = document.createElement('li');
        li.className = 'check-item' + (ok ? '' : ' bad');
        const head = document.createElement('div');
        head.className = 'check-label';
        head.textContent = (ok ? '✅ ' : '❌ ') + label;
        li.appendChild(head);
        if (detail) {
            const d = document.createElement('div');
            d.className = 'check-detail';
            d.textContent = detail;
            li.appendChild(d);
        }
        list.appendChild(li);
        return li;
    };

    // 0) 앱 버전: 서버(깃허브)에 올라간 최신 파일과 지금 화면의 버전 비교
    try {
        const res = await withTimeout(fetch('index.html?v=' + Date.now(), { cache: 'no-store' }), 8000);
        if (!res.ok) throw new Error('HTTP ' + res.status);
        const text = await res.text();
        const m = text.match(/APP_VERSION\s*=\s*'([^']+)'/);
        const latest = m ? m[1] : null;
        if (latest === APP_VERSION) {
            add(true, '앱 버전: ' + APP_VERSION, '최신 버전이에요.');
        } else {
            const li = add(false, '앱 버전: ' + APP_VERSION,
                latest ? `새 버전(${latest})이 올라와 있어요. 아래 버튼으로 최신으로 바꿔 주세요.`
                       : '서버의 파일에 버전 표시가 없어요. 업로드가 덜 됐거나 반영 중일 수 있어요.');
            if (latest) {
                const btn = document.createElement('button');
                btn.className = 'btn-recheck';
                btn.style.marginTop = '6px';
                btn.textContent = '최신 버전으로 바꾸기';
                btn.onclick = hardRefresh;
                li.appendChild(btn);
            }
        }
    } catch (e) {
        add(false, '앱 버전: ' + APP_VERSION, '서버의 최신 파일을 확인하지 못했어요: ' + ((e && e.message) || e));
    }

    // 1) 저장소 연결
    if (!syncReady) {
        add(false, '저장소 연결', '연결되지 않았어요. ' + (document.getElementById('timerStatus').textContent || '페이지를 새로고침하고 동기화 코드를 확인하세요.'));
        return;
    }
    add(true, '저장소 연결', '동기화 코드: ' + (localStorage.getItem(SYNC_ID_KEY) || '-'));

    // 2) 실제로 쓰고 다시 읽어 보기 (기록용 데이터에는 영향 없음)
    try {
        const stamp = Date.now();
        const ref = baseRef.child('pomodoro_check');
        await withTimeout(ref.set({ t: stamp }), 8000);
        const snap = await withTimeout(ref.once('value'), 8000);
        const back = snap.val();
        await withTimeout(ref.remove(), 8000);
        if (back && back.t === stamp) add(true, '저장·불러오기 테스트', '정상적으로 저장되고 다시 읽혀요.');
        else add(false, '저장·불러오기 테스트', '저장은 했는데 읽은 값이 달라요.');
    } catch (e) {
        add(false, '저장·불러오기 테스트', '실패: ' + ((e && (e.code || e.message)) || e) + ' (Firebase 규칙/권한을 확인하세요)');
        return;
    }

    // 3) 완료한 뽀모도로 기록
    const data = await getData();
    const todayData = data[getTodayKey()] || { pomo: 0, sessions: [] };
    const byStart = (a, b) => String(a.start).localeCompare(String(b.start));
    const todaySessions = todayData.sessions.slice().sort(byStart);
    if (todaySessions.length > 0) {
        const last = todaySessions[todaySessions.length - 1];
        add(true, `오늘 완료한 뽀모도로: ${todayData.pomo}회`, `마지막 기록: ${last.start} ~ ${last.end} · ${last.subject || '과목 미지정'}`);
    } else {
        const keys = Object.keys(data).filter(k => data[k].sessions.length > 0).sort();
        if (keys.length > 0) {
            const k = keys[keys.length - 1];
            const last = data[k].sessions.slice().sort(byStart).pop();
            add(true, `오늘 완료한 뽀모도로: ${todayData.pomo}회`, `오늘은 아직 없어요. 가장 최근 기록: ${formatNoYear(k)} ${last.start} ~ ${last.end} · ${last.subject || '과목 미지정'}`);
        } else {
            add(true, `오늘 완료한 뽀모도로: ${todayData.pomo}회`, '시간이 남은 기록은 아직 없어요. 타이머를 한 번 완료하면 여기에 나타나요.');
        }
    }

    // 4) 타이머 상태
    if (timerEndAt != null) add(true, '타이머', `${timerMode === 'break' ? '휴식' : '집중'} 진행 중 · 약 ${Math.ceil(timeLeft / 60)}분 남음 (끝나면 자동으로 처리돼요)`);
    else add(true, '타이머', '대기 중 (시작 버튼을 눌러야 기록 대상이 돼요)');
}

async function updateViews() {
    await renderTodayMemos();
    await renderCalendar();
    if (document.getElementById('calendarModal').style.display === 'flex') {
        await renderDetail(selectedDateKey);
    }
}

// 초기 로드
setTaskDate(getTodayKey());
document.getElementById('pomoDuration').value = focusMin;
updateTimerDisplay();
(async () => {
    await initCloudSync();
    await updateViews();
})();

// 화면으로 돌아왔을 때 한 번 더 최신 상태 확인 (보조용)
document.addEventListener('visibilitychange', async () => {
    if (!document.hidden) { await updateViews(); renderUpcoming(); purgeExpiredTrash(); }
});
// 자정이 지나면 D-day가 바뀌므로 1분마다 다시 계산
setInterval(renderUpcoming, 60 * 1000);
updateInstallBox();
</script>
