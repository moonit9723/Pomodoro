<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>포모도로 타이머 & 수행평가 관리</title>
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #080c10;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px 10px;
            margin: 0;
        }
        
        .container {
            display: flex;
            flex-direction: column;
            gap: 12px;
            max-width: 400px;
            width: 100%;
        }

        /* 화면 전환 제어 */
        .page {
            display: none;
            width: 100%;
            max-width: 420px;
            flex-direction: column;
            align-items: center;
        }
        .page.active { display: flex; }
        
        .card {
            background: #0f171e;
            padding: 16px;
            border-radius: 14px;
            border: 1px solid #00f3ff;
            box-shadow: 0 0 12px rgba(0, 243, 255, 0.12);
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
            width: 100%;
        }
        
        /* 상단 헤더 */
        .top-bar {
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 6px;
        }
        .icon-btn {
            background: none;
            border: none;
            color: #00f3ff;
            font-size: 1.2rem;
            cursor: pointer;
            padding: 4px;
            transition: transform 0.2s;
        }
        .icon-btn:hover { transform: scale(1.15); }
        .pomo-count-text { font-size: 0.82rem; color: #94a3b8; }
        .count-num { color: #00f3ff; font-weight: 700; }
        
        .subject-select {
            width: 100%;
            padding: 6px 10px;
            background-color: #080c10;
            border: 1px solid #00f3ff;
            color: #00f3ff;
            border-radius: 6px;
            font-size: 0.85rem;
            font-weight: 600;
            margin-bottom: 8px;
            outline: none;
        }

        /* 타이머 영역 */
        .timer-display {
            font-size: 3.5rem;
            font-weight: 800;
            color: #00f3ff;
            text-shadow: 0 0 15px rgba(0, 243, 255, 0.5);
            margin: 2px 0 10px 0;
            font-variant-numeric: tabular-nums;
            letter-spacing: 1px;
        }
        
        .btn-group { 
            display: flex; 
            flex-direction: column;
            gap: 6px; 
            width: 100%; 
        }
        .btn-start {
            width: 100%;
            background-color: transparent;
            color: #00f3ff;
            border: 1.5px solid #00f3ff;
            padding: 10px;
            font-size: 0.95rem;
            font-weight: 700;
            border-radius: 8px;
            cursor: pointer;
            box-shadow: 0 0 8px rgba(0, 243, 255, 0.15);
            transition: all 0.2s ease;
        }
        .btn-start:hover {
            background-color: #00f3ff;
            color: #080c10;
            box-shadow: 0 0 15px rgba(0, 243, 255, 0.5);
        }
        .btn-reset-small {
            width: 100%;
            background-color: transparent;
            color: #ff4d4d;
            border: 1px solid #3a1e28;
            padding: 4px;
            font-size: 0.72rem;
            font-weight: 600;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .btn-reset-small:hover {
            background-color: #ff4d4d;
            color: #ffffff;
            border-color: #ff4d4d;
        }
        
        .btn-thief {
            width: 100%;
            margin-top: 10px;
            background-color: #14222e;
            border: 1px dashed #00f3ff;
            color: #00f3ff;
            padding: 8px;
            border-radius: 8px;
            font-size: 0.85rem;
            font-weight: 700;
            cursor: pointer;
        }
        .btn-thief:hover { background-color: #1a2d3d; }

        /* 메모 영역 */
        .memo-section { align-items: stretch; padding: 14px; margin-top: 12px; }
        .input-box { display: flex; gap: 8px; margin-bottom: 8px; }
        .input-box input {
            flex: 1;
            padding: 8px 10px;
            background-color: #080c10;
            border: 1px solid #1e293b;
            color: #ffffff;
            border-radius: 6px;
            font-size: 0.85rem;
            outline: none;
        }
        .input-box input:focus { border-color: #00f3ff; }
        .btn-add { flex: 0 0 55px; padding: 8px; background: none; border: 1px solid #00f3ff; color: #00f3ff; border-radius: 6px; cursor: pointer; font-weight: bold; }

        .memo-list {
            list-style: none;
            padding: 0;
            margin: 0;
            display: flex;
            flex-direction: column;
            gap: 6px;
            max-height: 110px;
            overflow-y: auto;
        }
        .memo-item {
            background-color: #080c10;
            border: 1px solid #1e293b;
            padding: 6px 10px;
            border-radius: 6px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.82rem;
            color: #e2e8f0;
        }
        .btn-del { background: none; border: none; color: #475569; cursor: pointer; font-size: 0.8rem; }
        .btn-del:hover { color: #ff3366; }

        /* 모달 공통 */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.75);
            backdrop-filter: blur(3px);
            z-index: 100;
            justify-content: center;
            align-items: center;
        }
        .modal-content {
            background: #0f171e;
            border: 1px solid #00f3ff;
            box-shadow: 0 0 15px rgba(0, 243, 255, 0.2);
            border-radius: 14px;
            padding: 16px;
            width: 90%;
            max-width: 380px;
            max-height: 85vh;
            overflow-y: auto;
            position: relative;
        }
        .modal-close {
            position: absolute;
            top: 10px; right: 12px;
            background: none; border: none;
            color: #94a3b8; font-size: 1.1rem; cursor: pointer;
        }
        
        /* 달력 컴포넌트 */
        .calendar-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
        .calendar-title { font-size: 0.88rem; font-weight: 700; color: #00f3ff; }
        .calendar-nav { background: none; border: none; color: #94a3b8; cursor: pointer; }
        .calendar-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 3px; text-align: center; font-size: 0.7rem; }
        .day-name { color: #64748b; font-weight: 600; padding-bottom: 2px; }
        .day-cell {
            background-color: #080c10; border: 1px solid #1e293b; border-radius: 4px;
            padding: 3px 1px; min-height: 38px; display: flex; flex-direction: column;
            justify-content: space-between; align-items: center; cursor: pointer;
        }
        .day-cell.empty { border: none; background: none; cursor: default; }
        .day-cell.selected { border-color: #00f3ff; background-color: #1a2a3a; }
        .pomo-badge { font-size: 0.6rem; color: #00f3ff; font-weight: 700; }
        .detail-box { margin-top: 8px; padding-top: 8px; border-top: 1px solid #1e293b; font-size: 0.8rem; }
        .detail-title { color: #00f3ff; font-weight: 700; margin-bottom: 4px; }
        .detail-list { list-style: square; padding-left: 14px; margin: 0; color: #cbd5e1; }

        .thief-title { font-size: 0.95rem; font-weight: 700; color: #00f3ff; margin-bottom: 12px; text-align: center; }
        .rank-list { list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 8px; }
        .rank-item {
            display: flex; justify-content: space-between; align-items: center;
            background: #080c10; border: 1px solid #1e293b; padding: 8px 12px; border-radius: 6px; font-size: 0.85rem;
        }
        .rank-num { font-weight: 800; color: #00f3ff; width: 20px; }
        .rank-word { flex: 1; margin-left: 8px; }
        .rank-count { font-weight: 700; color: #94a3b8; }

        /* 수행평가 화면 스타일 */
        .eval-header {
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 12px;
        }
        .btn-back {
            background: none;
            border: 1px solid #00f3ff;
            color: #00f3ff;
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 0.82rem;
            font-weight: 700;
            cursor: pointer;
        }
        .btn-back:hover { background: #00f3ff; color: #080c10; }
        .eval-page-title { font-size: 1.05rem; font-weight: 800; color: #00f3ff; }
        
        .eval-subject-card {
            background: #080c10;
            border: 1px solid #1e293b;
            border-radius: 10px;
            padding: 12px;
            margin-bottom: 10px;
            width: 100%;
        }
        .eval-subject-title {
            font-size: 0.92rem;
            font-weight: 700;
            color: #00f3ff;
            margin-bottom: 8px;
            border-bottom: 1px solid #1e293b;
            padding-bottom: 4px;
        }
        .eval-item-list { display: flex; flex-direction: column; gap: 8px; }
        
        .eval-item-row {
            display: flex;
            flex-direction: column;
            gap: 6px;
            background: #0f171e;
            padding: 8px;
            border-radius: 6px;
            border: 1px solid #14222e;
        }
        .eval-item-top {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 0.83rem;
            color: #cbd5e1;
        }
        .eval-item-top input[type="checkbox"] { accent-color: #00f3ff; cursor: pointer; }
        
        .eval-item-inputs {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin-left: 22px;
            align-items: center;
        }
        
        .date-picker-container {
            display: flex;
            align-items: center;
            gap: 2px;
        }
        .date-picker-btn {
            background-color: #080c10;
            border: 1px solid #1e293b;
            color: #00f3ff;
            border-radius: 4px;
            padding: 3px 8px;
            font-size: 0.75rem;
            cursor: pointer;
            outline: none;
        }
        .date-picker-btn:hover { border-color: #00f3ff; }
        .date-reset-btn {
            background: none;
            border: 1px solid #1e293b;
            color: #ff4d4d;
            border-radius: 4px;
            padding: 2px 5px;
            font-size: 0.68rem;
            cursor: pointer;
        }
        .date-reset-btn:hover {
            border-color: #ff4d4d;
            background-color: #ff4d4d;
            color: #ffffff;
        }
        
        .eval-period-select, .score-input {
            background-color: #080c10;
            border: 1px solid #1e293b;
            color: #00f3ff;
            border-radius: 4px;
            padding: 2px 6px;
            font-size: 0.75rem;
            outline: none;
        }
        .score-input {
            width: 42px;
            text-align: center;
            color: #ffffff;
        }
        .score-input:focus, .eval-period-select:focus { border-color: #00f3ff; }
        .score-slash { font-size: 0.75rem; color: #64748b; }
    </style>
</head>
<body>

    <!-- [페이지 1] 타이머 메인 화면 -->
    <div id="app-timer" class="page active">
        <div class="container">
            <div class="card">
                <div class="top-bar">
                    <button class="icon-btn" onclick="openModal('calendarModal')" title="달력 보기">📅</button>
                    <div class="pomo-count-text">오늘 성공: <span class="count-num" id="todayPomo">0</span>회</div>
                    <button class="icon-btn" onclick="switchPage('app-eval')" title="수행평가 화면으로 이동">📝</button>
                </div>
                
                <select id="pomoSubject" class="subject-select">
                    <option value="독서와 작문">독서와 작문</option>
                    <option value="영어II">영어II</option>
                    <option value="미적분I">미적분I</option>
                    <option value="확률과 통계">확률과 통계</option>
                    <option value="생명과학">생명과학</option>
                    <option value="역학과 에너지">역학과 에너지</option>
                    <option value="음악">음악</option>
                    <option value="미술">미술</option>
                    <option value="체육">체육</option>
                    <option value="기타">기타</option>
                </select>

                <div class="timer-display" id="timer">25:00</div>
                
                <div class="btn-group">
                    <button class="btn-start" onclick="startTimer()">시작</button>
                    <button class="btn-reset-small" onclick="resetTimer()">초기화</button>
                </div>

                <button class="btn-thief" onclick="showThiefRank()">내 집중력 도둑은? 🔍</button>
            </div>

            <!-- 메모 카드 -->
            <div class="card memo-section">
                <div class="input-box">
                    <input type="text" id="wishInput" placeholder="딴생각 적기..." onkeypress="if(event.key==='Enter') addWish()">
                    <button class="btn-add" onclick="addWish()">적기</button>
                </div>
                <ul class="memo-list" id="memoList"></ul>
            </div>
        </div>
    </div>

    <!-- [페이지 2] 수행평가 및 시험 전체 화면 -->
    <div id="app-eval" class="page">
        <div class="card">
            <div class="eval-header">
                <button class="btn-back" onclick="switchPage('app-timer')">← 타이머로 돌아가기</button>
                <div class="eval-page-title">수행평가 체크리스트 📝</div>
            </div>
            <div id="evalContainer" style="width: 100%;"></div>
        </div>
    </div>

    <!-- 1. 메인 캘린더 모달 -->
    <div class="modal-overlay" id="calendarModal">
        <div class="modal-content">
            <button class="modal-close" onclick="closeModal('calendarModal')">✕</button>
            <div class="calendar-header">
                <button class="calendar-nav" onclick="changeMonth(-1)">❮</button>
                <div class="calendar-title" id="calendarMonth"></div>
                <button class="calendar-nav" onclick="changeMonth(1)">❯</button>
            </div>
            <div class="calendar-grid" id="calendarGrid"></div>
            
            <div class="detail-box" id="detailBox" style="display: none;">
                <div class="detail-title" id="detailDate"></div>
                <ul class="detail-list" id="detailList"></ul>
            </div>
        </div>
    </div>

    <!-- 2. 수행평가 전용 날짜 선택 캘린더 모달 -->
    <div class="modal-overlay" id="pickerModal">
        <div class="modal-content">
            <button class="modal-close" onclick="closeModal('pickerModal')">✕</button>
            <div class="calendar-header">
                <button class="calendar-nav" onclick="changePickerMonth(-1)">❮</button>
                <div class="calendar-title" id="pickerMonthTitle"></div>
                <button class="calendar-nav" onclick="changePickerMonth(1)">❯</button>
            </div>
            <div class="calendar-grid" id="pickerGrid"></div>
        </div>
    </div>

    <!-- 3. 집중력 도둑 순위 모달 -->
    <div class="modal-overlay" id="thiefModal">
        <div class="modal-content">
            <button class="modal-close" onclick="closeModal('thiefModal')">✕</button>
            <div class="thief-title">내 집중력 도둑 순위 🏆</div>
            <ul class="rank-list" id="rankList"></ul>
        </div>
    </div>

    <script>
        const FIXED_YEAR = 2026;

        /* 과목 및 항목 정의 (미적분I '수학노트', 역학과 에너지 '수행1,2,3' 반영) */
        const EVAL_SUBJECTS = [
            { name: "독서와 작문", items: ["도장", "독후감", "테스트"] },
            { name: "영어II", items: ["영어듣기", "노트", "원더"] },
            { name: "미적분I", items: ["9모 테스트", "10모 테스트", "수학노트"] },
            { name: "확률과 통계", items: ["부교재/교재", "9월 테스트", "10월 테스트"] },
            { name: "생명과학", items: ["수행1", "수행2", "수행3", "중간고사", "기말고사"] },
            { name: "역학과 에너지", items: ["수행1", "수행2", "수행3"] },
            { name: "음악", items: ["수행1", "수행2", "수행3"] },
            { name: "미술", items: ["수행1", "수행2", "수행3"] },
            { name: "체육", items: ["수행1", "수행2", "수행3"] }
        ];

        /* 날짜 초기화 버튼이 포함되어야 할 항목 목록 */
        const RESET_DATE_ITEMS = [
            "독서와 작문_독후감",
            "영어II_원더",
            "미적분I_수학노트",
            "확률과 통계_부교재/교재",
            "음악_수행1", "음악_수행2", "음악_수행3",
            "미술_수행1", "미술_수행2", "미술_수행3",
            "체육_수행1", "체육_수행2", "체육_수행3"
        ];

        /* 데이터 스토리지 */
        function getData() { return JSON.parse(localStorage.getItem('pomodoro_app_data') || '{}'); }
        function saveData(data) { localStorage.setItem('pomodoro_app_data', JSON.stringify(data)); }

        function getEvalData() { return JSON.parse(localStorage.getItem('pomodoro_eval_v3_data') || '{}'); }
        function saveEvalData(data) { localStorage.setItem('pomodoro_eval_v3_data', JSON.stringify(data)); }

        function getTodayKey() {
            const now = new Date();
            return `${FIXED_YEAR}-${String(now.getMonth() + 1).padStart(2, '0')}-${String(now.getDate()).padStart(2, '0')}`;
        }

        function formatNoYear(dateStr) {
            if (!dateStr) return '날짜 선택';
            const parts = dateStr.split('-');
            if (parts.length === 3) {
                return `${parseInt(parts[1])}월 ${parseInt(parts[2])}일`;
            }
            return dateStr;
        }

        function initDayData(data, dateKey) {
            if (!data[dateKey]) { data[dateKey] = { pomo: 0, memos: [] }; }
            return data;
        }

        /* 페이지 전환 */
        function switchPage(pageId) {
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            document.getElementById(pageId).classList.add('active');

            if (pageId === 'app-eval') {
                renderEvaluations();
            }
        }

        /* 모달 제어 */
        function openModal(id) { 
            document.getElementById(id).style.display = 'flex';
            if (id === 'calendarModal') renderCalendar();
        }
        function closeModal(id) { document.getElementById(id).style.display = 'none'; }

        /* 타이머 기능 */
        let timerInterval;
        let timeLeft = 25 * 60;

        function updateTimerDisplay() {
            const m = Math.floor(timeLeft / 60).toString().padStart(2, '0');
            const s = (timeLeft % 60).toString().padStart(2, '0');
            document.getElementById('timer').textContent = `${m}:${s}`;
        }

        function startTimer() {
            if (timerInterval) return;
            timerInterval = setInterval(() => {
                if (timeLeft > 0) {
                    timeLeft--;
                    updateTimerDisplay();
                } else {
                    clearInterval(timerInterval);
                    timerInterval = null;
                    
                    const today = getTodayKey();
                    let data = getData();
                    data = initDayData(data, today);
                    data[today].pomo += 1;
                    saveData(data);

                    const selectedSubject = document.getElementById('pomoSubject').value;
                    updateViews();
                    alert(`[${selectedSubject}] 25분 뽀모도로 완료!`);
                }
            }, 1000);
        }

        function resetTimer() {
            clearInterval(timerInterval);
            timerInterval = null;
            timeLeft = 25 * 60;
            updateTimerDisplay();
        }

        /* 메모 기능 */
        function addWish() {
            const input = document.getElementById('wishInput');
            let text = input.value.trim();
            if (!text) return;

            const today = getTodayKey();
            let data = getData();
            data = initDayData(data, today);
            data[today].memos.unshift(text);
            saveData(data);

            input.value = '';
            updateViews();
        }

        function deleteWish(index) {
            const today = getTodayKey();
            let data = getData();
            if (data[today] && data[today].memos) {
                data[today].memos.splice(index, 1);
                saveData(data);
                updateViews();
            }
        }

        function renderTodayMemos() {
            const today = getTodayKey();
            const data = getData();
            const todayData = data[today] || { pomo: 0, memos: [] };

            document.getElementById('todayPomo').textContent = todayData.pomo;

            const ul = document.getElementById('memoList');
            ul.innerHTML = '';
            todayData.memos.forEach((text, i) => {
                const li = document.createElement('li');
                li.className = 'memo-item';
                li.innerHTML = `
                    <span>${text}</span>
                    <button class="btn-del" onclick="deleteWish(${i})">✕</button>
                `;
                ul.appendChild(li);
            });
        }

        /* 집중력 도둑 순위 */
        const TARGET_WORDS = ['야구', '노래', '유튜브', '게임'];

        function showThiefRank() {
            const data = getData();
            const counts = { '야구': 0, '노래': 0, '유튜브': 0, '게임': 0 };

            Object.values(data).forEach(day => {
                if (day.memos && Array.isArray(day.memos)) {
                    day.memos.forEach(memo => {
                        TARGET_WORDS.forEach(word => {
                            if (memo.includes(word)) counts[word]++;
                        });
                    });
                }
            });

            const sorted = Object.entries(counts).sort((a, b) => b[1] - a[1]);

            const rankList = document.getElementById('rankList');
            rankList.innerHTML = '';

            sorted.forEach(([word, count], idx) => {
                const li = document.createElement('li');
                li.className = 'rank-item';
                li.innerHTML = `
                    <span class="rank-num">${idx + 1}</span>
                    <span class="rank-word">${word}</span>
                    <span class="rank-count">${count}회</span>
                `;
                rankList.appendChild(li);
            });

            openModal('thiefModal');
        }

        /* 메인 캘린더 */
        let currentDate = new Date(FIXED_YEAR, new Date().getMonth(), 1);
        let selectedDateKey = getTodayKey();

        function changeMonth(delta) {
            currentDate.setMonth(currentDate.getMonth() + delta);
            renderCalendar();
        }

        function selectDate(dateStr) {
            selectedDateKey = dateStr;
            renderCalendar();
            renderDetail(dateStr);
        }

        function renderDetail(dateStr) {
            const data = getData();
            const dayData = data[dateStr] || { pomo: 0, memos: [] };
            const detailBox = document.getElementById('detailBox');
            const detailTitle = document.getElementById('detailDate');
            const detailList = document.getElementById('detailList');

            detailBox.style.display = 'block';
            detailTitle.textContent = `${formatNoYear(dateStr)} (뽀모도로 ${dayData.pomo}회)`;
            detailList.innerHTML = '';

            if (dayData.memos.length === 0) {
                detailList.innerHTML = '<li>메모가 없습니다.</li>';
            } else {
                dayData.memos.forEach(m => {
                    const li = document.createElement('li');
                    li.textContent = m;
                    detailList.appendChild(li);
                });
            }
        }

        function renderCalendar() {
            const month = currentDate.getMonth();

            document.getElementById('calendarMonth').textContent = `${month + 1}월`;

            const grid = document.getElementById('calendarGrid');
            grid.innerHTML = '';

            const dayNames = ['일', '월', '화', '수', '목', '금', '토'];
            dayNames.forEach(d => {
                const div = document.createElement('div');
                div.className = 'day-name';
                div.textContent = d;
                grid.appendChild(div);
            });

            const firstDay = new Date(FIXED_YEAR, month, 1).getDay();
            const lastDate = new Date(FIXED_YEAR, month + 1, 0).getDate();
            const data = getData();

            for (let i = 0; i < firstDay; i++) {
                const div = document.createElement('div');
                div.className = 'day-cell empty';
                grid.appendChild(div);
            }

            for (let d = 1; d <= lastDate; d++) {
                const dayStr = `${FIXED_YEAR}-${String(month + 1).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
                const dayData = data[dayStr] || { pomo: 0, memos: [] };

                const div = document.createElement('div');
                div.className = 'day-cell' + (dayStr === selectedDateKey ? ' selected' : '');
                div.onclick = () => selectDate(dayStr);
                
                let html = `<span>${d}</span>`;
                if (dayData.pomo > 0) {
                    html += `<span class="pomo-badge">🍅${dayData.pomo}</span>`;
                }
                div.innerHTML = html;
                grid.appendChild(div);
            }
        }

        /* 날짜 선택 피커 */
        let pickerTargetKey = null;
        let pickerCurrentDate = new Date(FIXED_YEAR, new Date().getMonth(), 1);

        function openDatePicker(subjectName, itemName) {
            pickerTargetKey = `${subjectName}_${itemName}`;
            openModal('pickerModal');
            renderPickerCalendar();
        }

        function changePickerMonth(delta) {
            pickerCurrentDate.setMonth(pickerCurrentDate.getMonth() + delta);
            renderPickerCalendar();
        }

        function selectPickerDate(dateStr) {
            if (!pickerTargetKey) return;
            const evalData = getEvalData();
            if (!evalData[pickerTargetKey]) evalData[pickerTargetKey] = {};
            evalData[pickerTargetKey].date = dateStr;
            saveEvalData(evalData);

            closeModal('pickerModal');
            renderEvaluations();
        }

        function clearItemDate(subjectName, itemName) {
            const key = `${subjectName}_${itemName}`;
            const evalData = getEvalData();
            if (evalData[key]) {
                evalData[key].date = '';
                saveEvalData(evalData);
                renderEvaluations();
            }
        }

        function renderPickerCalendar() {
            const month = pickerCurrentDate.getMonth();
            document.getElementById('pickerMonthTitle').textContent = `${month + 1}월`;

            const grid = document.getElementById('pickerGrid');
            grid.innerHTML = '';

            const dayNames = ['일', '월', '화', '수', '목', '금', '토'];
            dayNames.forEach(d => {
                const div = document.createElement('div');
                div.className = 'day-name';
                div.textContent = d;
                grid.appendChild(div);
            });

            const firstDay = new Date(FIXED_YEAR, month, 1).getDay();
            const lastDate = new Date(FIXED_YEAR, month + 1, 0).getDate();

            for (let i = 0; i < firstDay; i++) {
                const div = document.createElement('div');
                div.className = 'day-cell empty';
                grid.appendChild(div);
            }

            for (let d = 1; d <= lastDate; d++) {
                const dayStr = `${FIXED_YEAR}-${String(month + 1).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
                const div = document.createElement('div');
                div.className = 'day-cell';
                div.onclick = () => selectPickerDate(dayStr);
                div.innerHTML = `<span>${d}</span>`;
                grid.appendChild(div);
            }
        }

        /* 수행평가 제어 및 렌더링 */
        function toggleEvalCheck(subjectName, itemName) {
            const evalData = getEvalData();
            const key = `${subjectName}_${itemName}`;
            if (!evalData[key]) evalData[key] = {};
            evalData[key].checked = !evalData[key].checked;
            saveEvalData(evalData);
            renderEvaluations();
        }

        function updateEvalDetail(subjectName, itemName, field, value) {
            const evalData = getEvalData();
            const key = `${subjectName}_${itemName}`;
            if (!evalData[key]) evalData[key] = {};
            evalData[key][field] = value;
            saveEvalData(evalData);
        }

        function renderEvaluations() {
            const container = document.getElementById('evalContainer');
            container.innerHTML = '';
            const evalData = getEvalData();

            EVAL_SUBJECTS.forEach(sub => {
                const card = document.createElement('div');
                card.className = 'eval-subject-card';

                const title = document.createElement('div');
                title.className = 'eval-subject-title';
                title.textContent = sub.name;
                card.appendChild(title);

                const itemList = document.createElement('div');
                itemList.className = 'eval-item-list';

                sub.items.forEach(item => {
                    const key = `${sub.name}_${item}`;
                    const itemData = evalData[key] || { checked: false, date: '', period: '1', score: '', maxScore: '' };

                    const row = document.createElement('div');
                    row.className = 'eval-item-row';

                    const top = document.createElement('label');
                    top.className = 'eval-item-top';
                    top.innerHTML = `
                        <input type="checkbox" ${itemData.checked ? 'checked' : ''} onchange="toggleEvalCheck('${sub.name}', '${item}')">
                        <span style="${itemData.checked ? 'text-decoration: line-through; color: #64748b;' : ''}">${item}</span>
                    `;

                    const inputs = document.createElement('div');
                    inputs.className = 'eval-item-inputs';

                    /* 날짜 선택 컨테이너 및 삭제(초기화) 버튼 */
                    const dateContainer = document.createElement('div');
                    dateContainer.className = 'date-picker-container';

                    const dateBtn = document.createElement('button');
                    dateBtn.className = 'date-picker-btn';
                    dateBtn.textContent = formatNoYear(itemData.date);
                    dateBtn.onclick = () => openDatePicker(sub.name, item);
                    dateContainer.appendChild(dateBtn);

                    // 지정된 항목들에만 날짜 삭제(✕) 버튼 추가
                    if (RESET_DATE_ITEMS.includes(key)) {
                        const dateResetBtn = document.createElement('button');
                        dateResetBtn.className = 'date-reset-btn';
                        dateResetBtn.textContent = '✕';
                        dateResetBtn.title = '날짜 초기화';
                        dateResetBtn.onclick = () => clearItemDate(sub.name, item);
                        dateContainer.appendChild(dateResetBtn);
                    }

                    // 교시 선택
                    const periodSelect = document.createElement('select');
                    periodSelect.className = 'eval-period-select';
                    for (let p = 1; p <= 7; p++) {
                        const opt = document.createElement('option');
                        opt.value = p;
                        opt.textContent = `${p}교시`;
                        if (String(itemData.period) === String(p)) opt.selected = true;
                        periodSelect.appendChild(opt);
                    }
                    periodSelect.onchange = (e) => updateEvalDetail(sub.name, item, 'period', e.target.value);

                    // 점수 입력
                    const scoreInput = document.createElement('input');
                    scoreInput.type = 'text';
                    scoreInput.className = 'score-input';
                    scoreInput.placeholder = '점수';
                    scoreInput.value = itemData.score || '';
                    scoreInput.onchange = (e) => updateEvalDetail(sub.name, item, 'score', e.target.value);

                    const slash = document.createElement('span');
                    slash.className = 'score-slash';
                    slash.textContent = '/';

                    const maxScoreInput = document.createElement('input');
                    maxScoreInput.type = 'text';
                    maxScoreInput.className = 'score-input';
                    maxScoreInput.placeholder = '만점';
                    maxScoreInput.value = itemData.maxScore || '';
                    maxScoreInput.onchange = (e) => updateEvalDetail(sub.name, item, 'maxScore', e.target.value);

                    inputs.appendChild(dateContainer);
                    inputs.appendChild(periodSelect);
                    inputs.appendChild(scoreInput);
                    inputs.appendChild(slash);
                    inputs.appendChild(maxScoreInput);

                    row.appendChild(top);
                    row.appendChild(inputs);
                    itemList.appendChild(row);
                });

                card.appendChild(itemList);
                container.appendChild(card);
            });
        }

        function updateViews() {
            renderTodayMemos();
            renderCalendar();
            if (document.getElementById('calendarModal').style.display === 'flex') {
                renderDetail(selectedDateKey);
            }
        }

        updateViews();
    </script>
</body>
</html>
