<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>포모도로 & 집중력 도둑 잡기</title>
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f6f9;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 30px 15px;
            margin: 0;
        }
        h1 { color: #2c3e50; margin-bottom: 25px; font-size: 1.8rem; }
        
        .container {
            display: flex;
            flex-direction: column;
            gap: 20px;
            max-width: 500px;
            width: 100%;
        }
        
        .card {
            background: white;
            padding: 25px;
            border-radius: 16px;
            box-shadow: 0 8px 16px rgba(0,0,0,0.06);
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        
        /* 타이머 영역 */
        .timer-display {
            font-size: 4rem;
            font-weight: 800;
            color: #e74c3c;
            margin: 15px 0;
            font-variant-numeric: tabular-nums;
        }
        
        .btn-group { display: flex; gap: 10px; }
        
        .btn {
            background-color: #2ecc71;
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            transition: transform 0.1s, opacity 0.2s;
        }
        .btn:active { transform: scale(0.98); }
        .btn:hover { opacity: 0.9; }
        .btn-reset { background-color: #95a5a6; }
        
        /* 도둑 잡기 메모 영역 */
        .thief-section { width: 100%; align-items: stretch; }
        .thief-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }
        .thief-title { font-size: 1.2rem; margin: 0; color: #34495e; }
        .counter {
            background-color: #e74c3c;
            color: white;
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 0.85rem;
            font-weight: bold;
        }
        
        .input-box { display: flex; gap: 8px; margin-bottom: 15px; }
        .input-box input {
            flex: 1;
            padding: 12px;
            border: 2px solid #ecf0f1;
            border-radius: 8px;
            font-size: 0.95rem;
            outline: none;
            transition: border-color 0.2s;
        }
        .input-box input:focus { border-color: #3498db; }
        
        .thief-list {
            list-style: none;
            padding: 0;
            margin: 0;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .thief-item {
            background-color: #f8f9fa;
            border-left: 4px solid #e74c3c;
            padding: 12px 15px;
            border-radius: 6px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.95rem;
        }
        .btn-del {
            background: none;
            border: none;
            color: #bdc3c7;
            cursor: pointer;
            font-size: 1rem;
            padding: 0 5px;
        }
        .btn-del:hover { color: #e74c3c; }
    </style>
</head>
<body>

    <h1>🍅 포모도로 & 🥷 집중력 도둑 잡기</h1>

    <div class="container">
        <!-- 1. 포모도로 타이머 -->
        <div class="card">
            <div class="timer-display" id="timer">25:00</div>
            <div class="btn-group">
                <button class="btn" onclick="startTimer()">몰입 시작</button>
                <button class="btn btn-reset" onclick="resetTimer()">초기화</button>
            </div>
        </div>

        <!-- 2. 집중력 도둑 체포 (하고 싶다 적기) -->
        <div class="card thief-section">
            <div class="thief-header">
                <h2 class="thief-title">🚨 수배 중인 집중력 도둑</h2>
                <div class="counter">체포된 도둑: <span id="count">0</span>명</div>
            </div>
            
            <div class="input-box">
                <input type="text" id="wishInput" placeholder="예: 유튜브 쇼츠 보고 싶다" onkeypress="if(event.key==='Enter') catchThief()">
                <button class="btn" style="background-color: #e74c3c;" onclick="catchThief()">도둑 체포</button>
            </div>

            <ul class="thief-list" id="thiefList"></ul>
        </div>
    </div>

    <script>
        /* 1. 타이머 로직 */
        let timerInterval;
        let timeLeft = 25 * 60;

        function updateTimerDisplay() {
            const minutes = Math.floor(timeLeft / 60).toString().padStart(2, '0');
            const seconds = (timeLeft % 60).toString().padStart(2, '0');
            document.getElementById('timer').textContent = `${minutes}:${seconds}`;
        }

        function startTimer() {
            if (timerInterval) return;
            timerInterval = setInterval(() => {
                if (timeLeft > 0) {
                    timeLeft--;
                    updateTimerDisplay();
                } else {
                    clearInterval(timerInterval);
                    timerInterval = null;
                    alert("🎉 25분 몰입 성공! 집중력 도둑을 잘 방어해냈습니다.");
                }
            }, 1000);
        }

        function resetTimer() {
            clearInterval(timerInterval);
            timerInterval = null;
            timeLeft = 25 * 60;
            updateTimerDisplay();
        }

        /* 2. 도둑 잡기 (~하고 싶다 체포) 로직 */
        let caughtCount = 0;

        function catchThief() {
            const input = document.getElementById('wishInput');
            let text = input.value.trim();
            if (!text) return;

            // "~하고 싶다"로 안 끝나면 자동으로 붙여주기
            if (!text.endsWith('하고 싶다') && !text.endsWith('하고싶다')) {
                text += ' 하고 싶다';
            }

            // 체포 카운트 증가
            caughtCount++;
            document.getElementById('count').textContent = caughtCount;

            // 목록에 추가
            const ul = document.getElementById('thiefList');
            const li = document.createElement('li');
            li.className = 'thief-item';
            li.innerHTML = `
                <span>🥷 <strong>[체포]</strong> ${text}</span>
                <button class="btn-del" onclick="releaseThief(this)">✕</button>
            `;
            ul.prepend(li); // 최신 도둑이 위로 오도록
            input.value = '';
        }

        function releaseThief(btn) {
            btn.parentElement.remove();
            caughtCount--;
            document.getElementById('count').textContent = caughtCount;
        }
    </script>
</body>
</html>
